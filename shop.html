<!DOCTYPE html>
<html lang="en">
<head><style id="mc-ipad">html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}*{touch-action:manipulation}input,select,textarea{font-size:max(16px,1em)!important}</style><script id="mc-ipad-js">(function(){var p=function(e){e.preventDefault();};document.addEventListener("gesturestart",p,{passive:false});document.addEventListener("gesturechange",p,{passive:false});document.addEventListener("dblclick",p,{passive:false});document.addEventListener("touchmove",function(e){if(e.scale!==undefined&&e.scale!==1)e.preventDefault();},{passive:false});var last=0;document.addEventListener("touchend",function(e){var n=Date.now(),t=e.target;if(n-last<350&&e.changedTouches.length===1&&!(t.closest&&t.closest("input,textarea,select"))){e.preventDefault();var b=t.closest&&t.closest("button,a,[role=button],label");if(b)b.click();}last=n;},{passive:false});var fix=function(){var v=window.visualViewport;if(v&&v.scale>1.01){var m=document.querySelector("meta[name=viewport]");if(m){var c=m.getAttribute("content");m.setAttribute("content",c+",width=device-width");setTimeout(function(){m.setAttribute("content",c);},60);}}};if(window.visualViewport)visualViewport.addEventListener("resize",function(){setTimeout(fix,400);});document.addEventListener("gestureend",function(){setTimeout(fix,200);});})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mathcade Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Baloo+2:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mathcade-pages.css">
<link rel="stylesheet" href="brick/brick-pages.css">
<link rel="stylesheet" href="brick/capsule.css">
<style>
.rgroup{margin:0 0 34px}
.rhead{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-family:var(--body)}
.rhead .rar{font-size:.85rem;padding:5px 12px}
.rhead .rline{flex:1;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--rc,#7E8E9F),transparent)}
.rhead .rn{font-weight:800;color:#B9D3DA;font-size:.9rem}
.rgroup.r-Uncommon{--rc:#24965A}.rgroup.r-Rare{--rc:#2C74D6}.rgroup.r-Legendary{--rc:#D9750A}.rgroup.r-Collector{--rc:#FF3DCB}
/* each card is coloured by its rarity; Legendary and Collector cards glow */
.icard{--rc:#7E8E9F;--rt:#EEF1F4;--rp1:#3A4F68;--rp2:#24364C;background:var(--rt);border-color:var(--rc);isolation:isolate}
.icard.r-Uncommon{--rc:#24965A;--rt:#E3F5EA;--rp1:#1F6B48;--rp2:#164A34}
.icard.r-Rare{--rc:#2C74D6;--rt:#E2EDFC;--rp1:#2B5FA8;--rp2:#1B3D73}
.icard.r-Legendary{--rc:#D9750A;--rt:#FFF0D9;--rp1:#9A5A14;--rp2:#5E3409}
.icard.r-Collector{--rc:#FF3DCB;--rt:#FFE3F6;--rp1:#C42A9C;--rp2:#5E1250;border-color:#FF3DCB}
.icard.r-Collector .rar.Collector{--rc:#FF3DCB;color:#3A0730}
.icard.r-Collector .col{background:#FF3DCB;color:#3A0730}
.icard .pv{background:radial-gradient(circle at 50% 60%,var(--rp1),var(--rp2) 75%)}
.icard.worn{border-color:var(--rc);box-shadow:0 0 0 4px #2EC4B6,0 6px 0 rgba(0,0,0,.22)}
.icard.r-Legendary,.icard.r-Collector{animation:rglow 2.6s ease-in-out infinite}
.icard.r-Legendary{--gl:255,176,40}.icard.r-Collector{--gl:255,61,203}
@keyframes rglow{0%,100%{box-shadow:0 6px 0 rgba(0,0,0,.22),0 0 10px 2px rgba(var(--gl),.45)}50%{box-shadow:0 6px 0 rgba(0,0,0,.22),0 0 26px 8px rgba(var(--gl),.85)}}
.icard.worn.r-Legendary,.icard.worn.r-Collector{animation:none;box-shadow:0 0 0 4px #2EC4B6,0 0 22px 6px rgba(var(--gl),.7)}
.icard.r-Legendary .pv::after,.icard.r-Collector .pv::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,rgba(255,255,255,.05) 55%,transparent 65%);background-size:250% 100%;animation:rshine 3.2s linear infinite}
@keyframes rshine{0%{background-position:130% 0}60%,100%{background-position:-60% 0}}
.icard.r-Legendary .pv::before,.icard.r-Collector .pv::before{content:'';position:absolute;inset:-40%;z-index:0;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 20deg,rgba(var(--gl),.35) 30deg,transparent 45deg 110deg,rgba(var(--gl),.3) 125deg,transparent 140deg 200deg,rgba(var(--gl),.35) 215deg,transparent 230deg 290deg,rgba(var(--gl),.3) 305deg,transparent 320deg);animation:rrays 14s linear infinite}
.icard .pv canvas,.icard .pv.txt > *{position:relative;z-index:1}
@keyframes rrays{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.icard.r-Legendary,.icard.r-Collector,.icard .pv::before,.icard .pv::after{animation:none!important}}
</style>
</head>
<body>
<div class="bwrap">
  <header class="bbar shop">
    <a class="home" href="index.html" aria-label="Home"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12H6M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Home</span></a>
    <h1><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 13H6z" fill="#FFF8EE" stroke="#4a2c22" stroke-width="2" stroke-linejoin="round"/><path d="M9 10V6a3 3 0 0 1 6 0v4" fill="none" stroke="#4a2c22" stroke-width="2" stroke-linecap="round"/></svg>Shop</h1>
    <a class="home" href="locker.html"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2" fill="#FFF8EE" stroke="currentColor" stroke-width="2"/><path d="M9 6h6M9 8.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="13.5" y="12" width="2" height="4" rx="1" fill="currentColor"/></svg><span>Locker</span></a>
    <div class="coins" id="coins" aria-live="polite"></div>
  </header>
  <section class="capbar" id="capbar" hidden aria-labelledby="capTitle">
    <div id="machine"></div>
    <div class="cap-info">
      <h2 id="capTitle">Capsule machine</h2>
      <div class="cap-price" id="capPrice"></div>
      <div id="capAct"></div>
    </div>
  </section>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="shop" role="tabpanel"><p class="emptybox">Loading…</p></div>
</div>
<script src="mathcade-config.js"></script>
<script src="mathcade-cloud.js"></script>
<script src="brick.js"></script>
<script src="brick/capsule.js"></script>
<script>
const $ = s => document.querySelector(s), esc = MC.esc, C = Brick.CATALOGUE;
const TABS = [['hat','Hats'],['shoes','Shoes'],['skin','Costumes'],['fx','Hat effects'],['companion','Companions'],['name','Name styles']];
const NAME_KINDS = ['colour','title','icon'];
const VIEWS = { hat:{ x0:-12, y0:-44, x1:252, y1:214 }, shoes:{ x0:6, y0:74, x1:234, y1:246 }, skin:{ x0:-16, y0:-34, x1:256, y1:246 }, fx:{ x0:-6, y0:-52, x1:246, y1:200 } };
// the Collector crowns are taller than other hats (and have their own effect above them): show them with more headroom
const BIG_HATS = ['H37','H38','H39'], BIG_HAT_VIEW = { x0:-30, y0:-74, x1:270, y1:214 };
const viewFor = it => (it.kind === 'hat' && BIG_HATS.includes(it.id)) ? BIG_HAT_VIEW : VIEWS[it.kind];
const isComp = it => it.kind === 'companion';   // companions show on their own (Brick.mount only:'companion'), animated (they blink)
let items = [], me = null, busy = false, confirmId = null, confirmTimer = 0, mounts = new Map();
let tab = TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : 'hat';
const coin = n => `${MC.coinSVG(16)} ${Number(n).toLocaleString()}`;
const rarity = it => (it.data && it.data.rarity) || '';
const tabOf = it => NAME_KINDS.includes(it.kind) ? 'name' : it.kind;
const owned = it => !!(me && me.owned.includes(it.id));
const myLook = () => me ? Brick.lookOf(me) : Brick.normalize({});
function worn(it){
  if(!me) return false;
  if(me.equipped[it.kind] !== it.id) return false;
  return !((it.kind === 'hat' || it.kind === 'shoes') && me.equipped.skin);   // hidden while a skin is on
}
function previewLook(it){
  const L = myLook();
  if(it.kind === 'hat' || it.kind === 'shoes') L.skin = null;
  L[it.kind] = it.id;
  return L;
}
function hasFx(L){
  const sh = C.item(L.shoes), sk = L.skin && C.item(L.skin), hat = L.hat && C.item(L.hat);
  return !!(L.fx || (sk && sk.fx) || (!L.skin && sh && sh.fx) || (!L.skin && hat && hat.fx));   // hat.fx: Collector crowns H37-H39
}
function action(it){
  if(it.data && it.data.buy === false && !owned(it)) return `<div class="col">Earned in events</div>`;
  if(!me) return `<button class="btn sun" data-login>Log in to buy</button>`;
  if(worn(it)) return `<button class="btn alt" data-off="${it.kind}" aria-label="Wearing ${esc(it.name)}. Tap to take it off">Wearing ✓</button>`;
  if(owned(it)) return `<button class="btn" data-wear="${it.id}">Wear</button>`;
  if(me.coins >= it.price) return confirmId === it.id
    ? `<button class="btn hot" data-buy="${it.id}">Tap again to buy</button>`
    : `<button class="btn sun" data-buy="${it.id}">Buy</button>`;
  return '';   // can't afford it yet: the price shows above
}
function meta(it){
  const r = rarity(it);
  const right = owned(it) ? '<span class="ok-badge">Owned</span>' : (it.data && it.data.buy === false) ? '<span class="muted">Events</span>' : `<span class="price">${coin(it.price)}</span>`;
  return `${r ? `<span class="rar ${r}">${r}</span>` : '<span></span>'}${right}`;
}
function card(it){
  const brick = tabOf(it) !== 'name', item = C.item(it.id);
  const fxTag = brick && (it.kind === 'fx' || (item && item.fx)) ? '<span class="tagfx">✨ Effect</span>' : '';
  return `<div class="icard r-${rarity(it) || 'Common'} ${worn(it) ? 'worn' : ''}" data-id="${it.id}">${fxTag}
    <div class="pv ${brick ? '' : 'txt'}" data-pv>${brick ? '' : namePreview(it)}</div>
    <div class="nm">${esc(it.name)}</div><div class="meta">${meta(it)}</div><div data-act>${action(it)}</div></div>`;
}
function namePreview(it){
  const look = Object.assign({}, me ? me.look : {});
  if(it.kind === 'colour') look.colour = it.data; if(it.kind === 'title') look.title = it.name; if(it.kind === 'icon') look.icon = it.data.shape;
  return MC.nameHTML(me ? me.username : 'Your name', look, { iconSize:22, title:false });
}
const RANK = { Common:0, Uncommon:1, Rare:2, Legendary:3, Collector:4 };
const byRarity = (a, b) => ((RANK[rarity(a)] ?? 0) - (RANK[rarity(b)] ?? 0)) || (a.price - b.price) || a.name.localeCompare(b.name);
function renderTabs(){
  $('#tabs').innerHTML = TABS.map(([id, label]) => {
    const n = items.filter(i => tabOf(i) === id && rarity(i) !== 'Free').length;
    return `<button class="tab" role="tab" data-tab="${id}" aria-selected="${tab === id}">${label} <span class="n">${n}</span></button>`;
  }).join('');
}
function renderGrid(){
  mounts.forEach(m => m.destroy()); mounts.clear();
  if(!MC.configured()){ $('#shop').innerHTML = '<p class="notice">The shop opens once your teacher has finished setting up Mathcade online.</p>'; return; }
  const list = items.filter(i => tabOf(i) === tab && rarity(i) !== 'Free').sort(byRarity);
  // one block per rarity, with a gap and a label between them, so the rarity scale is easy to see
  const groups = ['Common','Uncommon','Rare','Legendary','Collector'].map(r => [r, list.filter(i => (rarity(i) || 'Common') === r)]).filter(g => g[1].length);
  $('#shop').innerHTML = groups.length ? groups.map(([r, g]) => `<section class="rgroup r-${r}" aria-label="${r}"><h2 class="rhead"><span class="rar ${r}">${r}</span><span class="rline"></span><span class="rn">${g.length}</span></h2><div class="igrid">${g.map(card).join('')}</div></section>`).join('')
    : '<p class="emptybox">Nothing here yet.</p>';
  if(tab === 'name') return;
  list.forEach(it => {
    const el = $(`.icard[data-id="${it.id}"] [data-pv]`), L = previewLook(it);
    mounts.set(it.id, isComp(it) ? Brick.mount(el, L, { only:'companion', animate:true }) : Brick.mount(el, L, { view:viewFor(it), animate:hasFx(L), maxParticles:16 }));
  });
}
function refreshCards(){
  items.forEach(it => {
    const c = document.querySelector(`.icard[data-id="${it.id}"]`); if(!c) return;
    c.classList.toggle('worn', worn(it));
    c.querySelector('.meta').innerHTML = meta(it);
    c.querySelector('[data-act]').innerHTML = action(it);
    const m = mounts.get(it.id);
    if(m && !isComp(it)){ const L = previewLook(it); if(Brick.lookKey(L) !== Brick.lookKey(m.look)) m.set(L, { animate:hasFx(L) }); }
    else if(tab === 'name') c.querySelector('[data-pv]').innerHTML = namePreview(it);
  });
  $('#coins').innerHTML = me ? `${MC.coinSVG(26)} ${me.coins.toLocaleString()}` : '';
  renderCapsule();
}
function render(){ renderTabs(); renderGrid(); refreshCards(); }
async function load(){
  if(!MC.configured()){ render(); return; }
  try{
    const r = await MC.rpc('mc_shop', { p_token:MC.token() || null });
    items = r.items.filter(i => i.kind !== 'base'); me = r.me;
    capPrice = (r.capsule && r.capsule.price) || 40;
    if(me) loadPending(); else pending = null;
    render();
  }catch(e){ $('#shop').innerHTML = `<p class="notice">${esc(e.message)}</p>`; }
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if(!b || b.dataset.tab === tab) return;
  tab = b.dataset.tab; confirmId = null;
  try{ history.replaceState(null, '', '#' + tab); }catch(err){}
  renderTabs(); renderGrid(); refreshCards();
});
$('#shop').addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b || busy) return;
  if(b.hasAttribute('data-login')){ MC.ui.loginModal(); return; }
  if(b.dataset.buy && confirmId !== b.dataset.buy){       // first tap: ask again (no accidental buys on a tablet)
    confirmId = b.dataset.buy; clearTimeout(confirmTimer);
    confirmTimer = setTimeout(() => { confirmId = null; refreshCards(); }, 3500);
    refreshCards(); return;
  }
  busy = true; b.disabled = true;
  try{
    if(b.dataset.buy){
      const it = items.find(i => i.id === b.dataset.buy); confirmId = null;
      me = await MC.authed('mc_buy', { p_item:it.id });
      MC.ui.toast(`You bought <b>${esc(it.name)}</b>! You're wearing it now.`);
    }
    else if(b.dataset.wear){ const it = items.find(i => i.id === b.dataset.wear); me = await MC.authed('mc_equip', { p_kind:it.kind, p_item:it.id }); }
    else if(b.dataset.off) me = await MC.authed('mc_equip', { p_kind:b.dataset.off, p_item:null });
    MC.refreshMe();
  }catch(ex){ MC.ui.toast(esc(ex.message)); }
  busy = false; refreshCards();
});
/* ---------- capsule machine ---------- */
// The odds live on the server (mc_capsule_buy) and are never shown. The item is granted when the capsule is bought;
// opening it is just the reveal (an unopened capsule is remembered in sessionStorage so a reload can still open it).
const PEND_KEY = 'mathcade_capsule';
const REVEAL_VIEW = { x0:-26, y0:-58, x1:266, y1:256 };
let capPrice = 40, pending = null, capConfirm = false, capTimer = 0, capBusy = false, machine = null, revealing = false;
function loadPending(){
  // after a reload the server's profile already includes the prize, so it isn't added again (live:false)
  try{ const p = JSON.parse(sessionStorage.getItem(PEND_KEY) || 'null'); pending = p && me && p.user === me.username ? Object.assign(p.res, { live:false }) : null; }catch(e){ pending = null; }
}
function savePending(){
  try{ if(pending && me) sessionStorage.setItem(PEND_KEY, JSON.stringify({ user:me.username, res:pending })); else sessionStorage.removeItem(PEND_KEY); }catch(e){}
}
function renderCapsule(){
  const bar = $('#capbar');
  if(!MC.configured()){ bar.hidden = true; return; }
  bar.hidden = false;
  if(!machine){
    machine = Capsule.machine($('#machine'), { onTake:pickUp });
    if(pending) machine.setTray(pending.rarity);
  }
  $('#capPrice').innerHTML = `${MC.coinSVG(22)} ${capPrice} coins a capsule`;
  if(!pending && !capBusy) machine.setTray(null);
  let html;
  if(!me) html = `<button class="btn sun" data-login>Log in to buy</button>`;
  else if(capBusy) html = `<button class="btn hot" disabled>Here it comes…</button>`;
  else if(pending || revealing) html = `<button class="btn hot go" data-take ${revealing ? 'disabled' : ''}>Tap your capsule!</button>`;
  else if(me.coins < capPrice) html = `<button class="btn need" disabled>Need ${capPrice - me.coins} more</button>`;
  else html = capConfirm ? `<button class="btn hot" data-capbuy>Tap again to buy</button>` : `<button class="btn sun" data-capbuy>Buy a capsule</button>`;
  $('#capAct').innerHTML = html;
}
$('#capAct').addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b || capBusy) return;
  if(b.hasAttribute('data-login')){ MC.ui.loginModal(); return; }
  if(b.hasAttribute('data-take')){ pickUp(); return; }
  if(!b.hasAttribute('data-capbuy')) return;
  if(!capConfirm){                                    // first tap: ask again (no accidental buys on a tablet)
    capConfirm = true; clearTimeout(capTimer);
    capTimer = setTimeout(() => { capConfirm = false; renderCapsule(); }, 3500);
    renderCapsule(); return;
  }
  capConfirm = false; clearTimeout(capTimer); capBusy = true; b.disabled = true;
  renderCapsule();
  try{
    const r = await MC.authed('mc_capsule_buy', {});
    const res = { rarity:r.rarity, item:r.item, refund:r.refund || 0, live:true };
    me.coins = r.me.coins - (r.refund || 0);           // the price comes off now; the prize (and any refund) shows when it's opened
    refreshCards();
    await machine.dispense(res.rarity);                // crank turns, the capsule drops into the tray (its colour shows the rarity)
    pending = res; savePending();
  }catch(ex){ MC.ui.toast(esc(ex.message)); }
  capBusy = false; refreshCards();
});
function pickUp(){
  if(!pending || revealing || capBusy) return;
  revealing = true; renderCapsule();
  const res = pending;
  Capsule.open(res, {
    esc, coinSVG:MC.coinSVG,
    from:() => machine.trayRect(),
    renderItem(el, it){ const L = previewLook(it); return isComp(it) ? Brick.mount(el, L, { only:'companion', animate:true }) : Brick.mount(el, L, { view:(VIEWS[it.kind] && viewFor(it)) || REVEAL_VIEW, animate:true, maxParticles:28 }); },
    async onWear(it){
      try{ me = await MC.authed('mc_equip', { p_kind:it.kind, p_item:it.id }); MC.ui.toast(`You're wearing <b>${esc(it.name)}</b>!`); }
      catch(ex){ MC.ui.toast(esc(ex.message)); throw ex; }
    },
    onClose(){
      revealing = false; refreshCards();
      MC.refreshMe().then(u => { if(u && me && u.username === me.username){ me = u; refreshCards(); } });
    },
  });
  // picked up: the prize now shows as theirs in the shop behind the overlay
  pending = null; savePending(); machine.setTray(null);
  if(me && res.live){
    if(res.item && !me.owned.includes(res.item.id)) me.owned = me.owned.concat(res.item.id);
    me.coins += res.refund || 0;
  }
}
MC.onUser(u => { if(!!u !== !!me || (u && me && u.username !== me.username)) load(); });
load();
</script>
</body>
</html>
