<!DOCTYPE html>
<html lang="en">
<head><style id="mc-ipad">html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}*{touch-action:manipulation}input,select,textarea{font-size:max(16px,1em)!important}</style><script id="mc-ipad-js">(function(){var p=function(e){e.preventDefault();};document.addEventListener("gesturestart",p,{passive:false});document.addEventListener("gesturechange",p,{passive:false});document.addEventListener("dblclick",p,{passive:false});document.addEventListener("touchmove",function(e){if(e.scale!==undefined&&e.scale!==1)e.preventDefault();},{passive:false});var last=0;document.addEventListener("touchend",function(e){var n=Date.now(),t=e.target;if(n-last<350&&e.changedTouches.length===1&&!(t.closest&&t.closest("input,textarea,select"))){e.preventDefault();var b=t.closest&&t.closest("button,a,[role=button],label");if(b)b.click();}last=n;},{passive:false});var fix=function(){var v=window.visualViewport;if(v&&v.scale>1.01){var m=document.querySelector("meta[name=viewport]");if(m){var c=m.getAttribute("content");m.setAttribute("content",c+",width=device-width");setTimeout(function(){m.setAttribute("content",c);},60);}}};if(window.visualViewport)visualViewport.addEventListener("resize",function(){setTimeout(fix,400);});document.addEventListener("gestureend",function(){setTimeout(fix,200);});})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mathcade Teacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Luckiest+Guy&family=Lilita+One&family=Black+Ops+One&family=Chewy&family=Pirata+One&family=Creepster&family=Rye&family=Racing+Sans+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game-tiles.css">
<link rel="stylesheet" href="mathcade-pages.css">
<style>
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 0;padding:0}
/* file tabs: the chosen tab joins the card below it */
#tabs .pill{border-radius:16px 16px 0 0;border:0;background:rgba(255,255,255,.08);color:#B9D3DA;padding:11px 20px 12px;font-size:1rem;box-shadow:none}
#tabs .pill:hover{color:var(--cream);background:rgba(255,255,255,.14)}
#tabs .pill[aria-pressed="true"]{background:var(--card);color:var(--ink);border-color:var(--card)}
#t-host > .card:first-child,#t-students > .card:first-child,#t-past > .card:first-child{border-top-left-radius:0}
/* while a game is hosted the tab joins the dark host screen instead */
.hosting #tabs .pill[aria-pressed="true"]{background:var(--bg-2,#1D3352);color:var(--sun)}
.hosting .hosttop{border-top-left-radius:0}
.gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gtile{position:relative;border-radius:16px;background:#1D3352;overflow:hidden;display:grid;grid-template-rows:auto 1fr;place-items:center;border:4px solid transparent;transition:transform .12s;padding:0}
.gtile:hover{transform:translateY(-2px)}
.gtile[aria-pressed="true"]{border-color:var(--sun);background:#24406A;box-shadow:0 0 0 3px var(--ink)}
.gtile .in{width:215px;height:168px;zoom:.7;display:grid;place-items:center;padding:4px 10px 30px;pointer-events:none}
.gtile .in{position:relative}.gtile .in:has(.wm-scene){padding:0}
.gtile .tag{align-self:stretch;justify-self:stretch;display:grid;place-items:center;padding:6px 8px 7px;font-family:'Baloo 2',var(--body);font-weight:700;font-size:.82rem;line-height:1.15;color:#fff;text-align:center;text-wrap:balance;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.gtile .txt{font-family:var(--title);color:#fff;font-size:1.2rem;text-align:center;padding:8px;font-weight:700}
.gtile .tick{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;background:var(--sun);color:var(--hint);font-weight:900;display:none;place-items:center;font-size:.9rem;box-shadow:0 2px 0 var(--sun-edge)}
.gtile[aria-pressed="true"] .tick{display:grid}
.gtile.soon{cursor:default}.gtile.soon:hover{transform:none}
.gtile.soon .in{opacity:.75}
.gtile .soonb{position:absolute;left:8px;top:8px;background:#FFE36B;color:#4A2606;font-weight:900;font-size:.72rem;border-radius:999px;padding:2px 9px;box-shadow:0 2px 0 #D9A21F}
.picked{margin:12px 0 0;font-weight:900;font-size:1.05rem}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:6px;align-items:start}
.setgrid > .fld{min-width:0;margin:0;background:var(--chip);border-radius:14px;padding:10px 12px 12px}
.setgrid > .fld > span:first-child{display:block;font-weight:900;font-size:.88rem;margin-bottom:6px}
.setgrid select{display:block;width:100%;max-width:100%;min-width:0}
.setgrid .pills .pill:not([aria-pressed="true"]){background:#fff}
.setgrid .stepper{background:transparent;padding:0}
.hosting #tabs [data-t="students"],.hosting #tabs [data-t="past"]{display:none}
/* keep the teacher's name and coins in the top right, on the same row as the title */
#nav.mcnav{flex-wrap:nowrap}
/* classes (year groups) on the Students tab */
.classes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 2px}
.cls{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:900;font-size:.95rem;color:var(--ink,#1E2433);background:var(--chip,#F6E7D3);border:2px solid var(--chip-edge,#E2C9A6);border-radius:999px;padding:6px 8px 6px 14px;cursor:pointer}
.cls span{background:rgba(0,0,0,.08);border-radius:999px;padding:1px 8px;font-size:.82rem}
.cls[aria-selected="true"]{background:#1E2433;color:#FFE36B;border-color:#1E2433}
.cls[aria-selected="true"] span{background:rgba(255,255,255,.16)}
.cls i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.12)}
.cls i:hover{background:#FF5A3C;color:#fff}
.newcls{display:flex;gap:6px;align-items:center}
.newcls input{width:13em;padding:6px 10px;font-size:.95rem}
.bulk[hidden]{display:none}
.bulk{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#FFE36B;border-radius:14px;padding:8px 12px;margin-bottom:10px;box-shadow:0 4px 0 #D9A21F}
.bulk .fld{margin:0}
.studs .pick{width:34px;text-align:center}
.studs .pick input{width:20px;height:20px}
.rowgrp{font:inherit;font-weight:800;font-size:.9rem;padding:4px 8px;border-radius:10px;max-width:9.5em}
/* header bar (draft B): everything in one rounded navy bar, thin dividers between the logo, title, links and your name */
#nav.mcnav{background:var(--bg-2,#1D3352);border-radius:18px;padding:10px 14px;margin-top:12px;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#nav .navtitle{font-size:clamp(1.3rem,2.4vw,1.75rem);padding-left:14px;border-left:2px solid rgba(255,255,255,.15)}
#nav .logo{margin-right:0}
#nav .who{padding-left:12px;border-left:2px solid rgba(255,255,255,.15)}
#nav .lk{padding:0;width:40px;height:40px;justify-content:center}
#nav .navtitle{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
#nav .who{flex:none}
#nav .lk{white-space:nowrap}
#nav .lk span{display:none}   /* icons only here, so the title and your name fit on one row */
.navtitle{margin:0;font-family:var(--title);font-weight:700;font-size:clamp(1.6rem,3vw,2.3rem);color:var(--sun);text-shadow:0 3px 0 var(--hot-edge);line-height:1}
.stepper{display:inline-flex;align-items:center;gap:12px;background:var(--chip);border-radius:12px;padding:4px}
.stepper button{width:40px;height:40px;border-radius:10px;background:#fff;box-shadow:inset 0 -3px 0 var(--chip-edge);font-weight:900;font-size:1.1rem}
.stepper output{min-width:2.4em;padding:0 4px;text-align:center;font-family:var(--title);font-size:1.4rem;font-weight:700}
/* host screen, made to be readable on a projector */
.host{position:relative}
.host.full{position:fixed;inset:0;z-index:100;overflow:auto;background:var(--bg);padding:16px 22px}
.hosttop{container-type:inline-size;display:grid;gap:10px;justify-items:stretch;background:var(--bg-2,#1D3352);border-radius:26px;padding:16px 20px 18px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.bigcode{font-family:'Chakra Petch',Impact,sans-serif;font-size:clamp(3rem,15cqw,17rem);letter-spacing:.12em;padding-left:.12em;white-space:nowrap;overflow:hidden;color:var(--sun);text-shadow:0 6px 0 var(--hot-edge);line-height:1;text-align:center;font-weight:700}
.hostbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}
.hostbar h2{margin:0;font-family:var(--title);font-weight:700;font-size:clamp(1.4rem,2.6vw,2.1rem);color:var(--cream);flex:1}
.clock{font-family:'Chakra Petch',Impact,sans-serif;font-size:clamp(1.8rem,4vw,3rem);color:#fff;background:var(--bg-3);border-radius:14px;padding:4px 16px;font-weight:700}
.clock.low{color:#FF8A75}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border-radius:14px;padding:8px 12px;font-size:1.15rem;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:pop .25s ease-out}
.chip .x{width:24px;height:24px;border-radius:50%;background:var(--chip);font-weight:900;font-size:.8rem;color:var(--ink-soft)}
.chip .tm{width:12px;height:12px;border-radius:50%}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.teams{display:grid;gap:10px;margin:0 0 14px}
.teambar{display:grid;grid-template-columns:9em 1fr 6em;align-items:center;gap:10px;font-weight:900;font-size:1.2rem}
.teambar .bar{height:30px;border-radius:10px;background:rgba(255,255,255,.12);overflow:hidden}
.teambar .bar i{display:block;height:100%;border-radius:10px;transition:width .6s}
.live{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:clamp(1rem,1.5vw,1.3rem)}
.live td{background:var(--card);color:var(--ink);padding:10px 12px;font-weight:900}
.live td:first-child{border-radius:12px 0 0 12px;width:3.5em;text-align:center;font-family:var(--title);font-size:1.3em;font-weight:700}
.live td:last-child{border-radius:0 12px 12px 0}
.live td.sc{font-family:var(--title);font-size:1.35em;text-align:right;font-weight:700}
.live td.st{color:var(--ink-soft);font-size:.85em}
.live tr.idle td{opacity:.6}
.live .fin{color:var(--good)}
/* Final results podium: the top three's own characters on gold / silver / bronze steps, revealed 3rd, 2nd, then 1st */
.pod{position:relative;overflow:hidden;display:flex;justify-content:center;align-items:flex-end;gap:clamp(10px,2vw,26px);margin:6px auto 26px;padding-top:30px;max-width:980px;min-height:clamp(380px,52vh,560px);isolation:isolate}
.pod-title{text-align:center;font-family:'Chakra Petch',var(--title);font-weight:700;font-size:clamp(2rem,4.5vw,3.6rem);color:var(--sun);text-shadow:0 5px 0 var(--hot-edge);margin:4px 0 0;letter-spacing:.04em}
.pod .rays{position:absolute;left:50%;bottom:20%;width:min(900px,120%);aspect-ratio:1;transform:translateX(-50%);z-index:-1;opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,227,107,.16) 0 10deg,transparent 10deg 22deg);border-radius:50%;
  -webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);animation:podRays 26s linear infinite}
.pod.done .rays{opacity:1;transition:opacity 1s}
@keyframes podRays{to{transform:translateX(-50%) rotate(360deg)}}
.step{position:relative;display:flex;flex-direction:column;align-items:center;width:clamp(150px,22vw,260px);opacity:0;transform:translateY(60px) scale(.9)}
.step.in{opacity:1;transform:none;transition:transform .7s cubic-bezier(.2,1.6,.4,1),opacity .4s}
.step .who{width:100%;height:0;padding-bottom:100%;position:relative}
.step .who>canvas{position:absolute;left:0;top:0;width:100%!important;height:100%!important}   /* a fixed square (iPad Safari grew canvas-in-aspect-ratio boxes) */
.step .crown{position:absolute;left:-18px;top:-30px;transform:rotate(-18deg);width:clamp(54px,6vw,76px);filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));z-index:2;animation:podBob 1.6s ease-in-out infinite}
@keyframes podBob{50%{transform:rotate(-8deg) translateY(-6px)}}
.step .nm,.step .sc,.step .place{flex:none}
/* name + score sit at the same height on all three steps (the steps share a bottom edge) */
.step .block>.foot{position:absolute;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.step .nm{font-weight:800;font-size:clamp(1rem,1.6vw,1.3rem);max-width:88%;text-align:center;background:rgba(19,35,58,.88);color:#fff;border-radius:12px;padding:5px 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .nm .mc-nm{max-width:100%}
.step .block{position:relative;width:100%;margin-top:-2px;gap:14px;padding:16px 0 18px;border-radius:18px 18px 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  color:#3B2300;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18),0 10px 0 rgba(0,0,0,.3)}
.step .place{font-family:'Chakra Petch',Impact,sans-serif;font-weight:700;font-size:clamp(2.4rem,4vw,3.4rem);line-height:1}
.step .place sup{font-size:.4em;vertical-align:top;margin-left:2px}
.step .sc{font-family:'Chakra Petch',var(--title);font-weight:700;font-size:clamp(1.4rem,2.4vw,2.1rem);line-height:1;color:#3B2300;font-variant-numeric:tabular-nums}
.step.p1 .block{height:clamp(250px,31vh,290px);background:linear-gradient(180deg,#FFE680,#F2B705);box-shadow:inset 0 -10px 0 rgba(0,0,0,.18),0 10px 0 rgba(0,0,0,.3),0 0 40px rgba(255,210,63,.55)}
.step.p2 .block{height:clamp(225px,27vh,255px);background:linear-gradient(180deg,#DCE3EB,#8E9BAB)}
.step.p3 .block{height:clamp(205px,24vh,230px);background:linear-gradient(180deg,#F4C18E,#C7783A)}
.step.p1{order:2}.step.p2{order:1}.step.p3{order:3}
.step.p1 .who{transform:scale(1.15);transform-origin:bottom}
.step .who{margin-bottom:-6px;z-index:1}
.pod .conf{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:3}
.pod .conf i{position:absolute;top:0;width:10px;height:16px;border-radius:2px;opacity:0;animation:podFall var(--d,3s) ease-in var(--dl,0s) forwards}
@keyframes podFall{0%{opacity:1;transform:translate(0,-20px) rotate(0)}100%{opacity:0;transform:translate(var(--dx,0),520px) rotate(var(--r,540deg))}}
.step .sc{text-align:center}
.step .sc small{display:block;margin-top:4px;font-family:'Baloo 2',sans-serif;font-size:.5em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.step .block .shine{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.step .block .shine::before{content:'';position:absolute;top:-20%;bottom:-20%;left:-60%;width:45%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35) 30%,rgba(255,255,255,.95) 50%,rgba(255,255,255,.35) 70%,transparent);animation:podShine 2.8s ease-in-out infinite}
.step.p2 .block .shine::before{animation-delay:.6s}.step.p3 .block .shine::before{animation-delay:1.2s}
/* sparkles that twinkle on each step */
.step .block .spk{position:absolute;width:14px;height:14px;pointer-events:none;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:podTw 2.8s ease-in-out infinite;opacity:0}
@keyframes podTw{0%,60%,100%{opacity:0;transform:scale(.3) rotate(0)}75%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes podShine{0%{left:-60%}45%,100%{left:130%}}
.step .block .shine::after{content:'';position:absolute;left:8%;right:8%;top:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.45)}
.step .block>.place{position:relative}
.step .block>.crown{position:absolute}
@media (prefers-reduced-motion:reduce){.step .block .shine::before,.step .block .spk{animation:none;display:none}.step,.step.in{transition:none;opacity:1;transform:none}.pod .rays,.step .crown,.pod .conf i{animation:none}.pod .conf{display:none}}
.studs td{padding:7px 8px}
.studs td .btn{margin:2px}
.cards{display:none}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  .cards,.cards *{visibility:visible}
  .cards{display:grid!important;position:absolute;left:0;top:0;width:100%;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0}
  .lcard{border:2px dashed #999;border-radius:10px;padding:10px;color:#000;font-family:Arial,sans-serif;break-inside:avoid}
  .lcard b{font-size:1.2rem}
}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <nav id="nav"></nav>
  <div id="gate"></div>
  <div id="app" hidden>
    <div class="tabs pills" id="tabs" role="tablist">
      <button class="pill" data-t="host">Host a class game</button><button class="pill" data-t="students">Students</button><button class="pill" data-t="past">Past games</button>
    </div>
    <section id="t-host"></section>
    <section id="t-students" hidden></section>
    <section id="t-past" hidden></section>
  </div>
</div>
<div class="cards" id="cards"></div>
<script src="mathcade-config.js"></script>
<script src="mathcade-cloud.js"></script>
<script src="mathcade-nav.js"></script>
<script src="brick.js"></script>
<script src="game-tiles.js"></script>
<script>
const $ = s => document.querySelector(s), esc = MC.esc;
MCNav.mount($('#nav'), { current:'teacher', title:'Teacher dashboard' });
const SITE = MC.root.replace(/^https?:\/\//, '').replace(/\/$/, '').replace(/\/index\.html$/, '');
const store = { get:k => { try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:(k,v) => { try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} } };

$('#tabs').onclick = e => { const b = e.target.closest('[data-t]'); if(!b) return; showTab(b.dataset.t);
  if(b.dataset.t === 'host' && !$('#t-host').innerHTML.trim()) hostSetup(); };
function showTab(t){
  document.querySelectorAll('#tabs .pill').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t));
  ['host','students','past'].forEach(x => $('#t-' + x).hidden = x !== t);
  if(t === 'students') loadStudents(); if(t === 'past') loadPast();
}

/* ---------- host: choose a game and its settings ---------- */
let pick = { game:'fishing', settings:{} };
function defaults(g){ const s = {}; g.settings.forEach(f => s[f.key] = f.def); return s; }
function hostSetup(gameId){
  stopPoll(); document.body.classList.remove('hosting'); store.set('mc_host_code', null);
  if(/[?&]code=/.test(location.search)){ const u = new URL(location.href); u.searchParams.delete('code'); history.replaceState(null, '', u); }
  const g0 = MC.gameById(gameId) || MC.gameById(pick.game) || MC.GAMES[0];
  pick = { game:g0.id, settings:Object.assign(defaults(g0), JSON.parse(store.get('mc_host_settings_' + g0.id) || '{}')) };
  const tq = new URLSearchParams(location.search).get('track'); if(tq && g0.id === 'grand-prix') pick.settings.track = tq;
  // a remembered or linked choice that is no longer offered (e.g. a retired circuit) goes back to the default
  g0.settings.forEach(f => { if(f.type === 'choice' && !f.options.some(o => String(o[0]) === String(pick.settings[f.key]))) pick.settings[f.key] = f.def; });
  render();
  function render(){
    const g = MC.gameById(pick.game);
    $('#t-host').innerHTML = `<div class="card">
      <h2>1. Choose a game</h2>
      <div class="gamegrid">${tiles().map(x => `<button class="gtile" type="button" data-g="${x.game}" ${x.track ? `data-track="${x.track}"` : ''} aria-label="${esc(x.name)}" aria-pressed="${x.game === g.id && (!x.track || x.track === pick.settings.track)}">${x.html ? `<span class="in">${x.html}</span>` : `<span class="txt">${esc(x.name)}</span>`}<span class="tick" aria-hidden="true">✓</span>${x.tagline ? `<span class="tag" style="background:${x.bg}">${esc(x.tagline)}</span>` : ''}</button>`).join('')}${(window.MC_SOON_TILES || []).map(x => `<div class="gtile soon" role="img" aria-label="${esc(x.name)}: coming soon">${x.html ? `<span class="in">${x.html}</span>` : `<span class="txt">${esc(x.name)}</span>`}<span class="soonb">${esc(x.badge)}</span>${x.tagline ? `<span class="tag" style="background:${x.bg}">${esc(x.tagline)}</span>` : ''}</div>`).join('')}</div>
      <p class="picked">Chosen: ${esc(g.name)}${g.id === 'grand-prix' ? ' · ' + esc(trackName(pick.settings.track)) : ''}</p>
      <h2 style="margin-top:20px">2. Settings for the whole class</h2>
      <div class="setgrid">${g.settings.map(f => field(f, pick.settings[f.key])).join('')}</div>
      ${g.teams || g.teamsFrom ? `<p class="muted">Students are put into teams automatically as they join. ${esc(g.teamNote || 'Team totals show on the big screen.')}</p>` : ''}
      ${g.note ? `<p class="muted">${esc(g.note)}</p>` : ''}
      <h2 style="margin-top:20px">3. Get a code for your class</h2>
      <button class="btn" id="create" style="font-size:1.2rem;padding:14px 26px">Create game code</button> <span class="err" id="cerr"></span></div>`;
    $('#t-host').querySelectorAll('[data-g]').forEach(b => b.onclick = () => { const ng = MC.gameById(b.dataset.g);

/* ---------- host screen: lobby, live board, results ---------- */
let host = { code:null, board:null, timer:0, clockT:0, offset:0, live:null, liveCode:null, liveN:0 };
function stopPoll(){ clearTimeout(host.timer); clearInterval(host.clockT); stopLive(); }
/* live multiplayer games: this screen relays everyone's position to everyone else */
function stopLive(){ if(host.live){ try{ host.live.close(); }catch(e){} } host.live = null; host.liveCode = null; host.liveN = 0; }
async function startLive(code){
  if(host.liveCode === code) return;
  stopLive(); host.liveCode = code; paintLive('connecting');
  const game = host.board && host.board.game && host.board.game.id;
  try{ host.live = await MC.live.host(code, players => { host.liveN = players.length; paintLive('ok'); },
                                      { game, now:() => Date.now() + host.offset, board:() => host.board }); paintLive('ok'); }
  catch(e){ console.warn(e); host.liveCode = null; paintLive('fail'); setTimeout(() => { if(host.code === code && !host.live) startLive(code); }, 5000); }
}
function paintLive(state){
  const el = document.getElementById('liveLink'); if(!el) return;
  el.hidden = false;
  const info = state === 'ok' && host.live && host.live.info;
  el.innerHTML = state === 'fail' ? '<b style="color:#FF8A75">\u25CF</b> Live link failed, retrying\u2026'
    : state === 'connecting' ? '<b style="color:#FFE36B">\u25CF</b> Connecting live link\u2026'
    : `<b style="color:#3CD48A">\u25CF</b> Live link: ${host.liveN} device${host.liveN === 1 ? '' : 's'} sending \u00b7 keep this tab open${info ? ` \u00b7 <span style="color:#fff">${esc(info)}</span>` : ''}`;
}
function openHost(code, board){
  stopPoll(); host.code = code; host.liveTeams = null; store.set('mc_host_code', code);
  const u = new URL(location.href); u.search = '?code=' + code; history.replaceState(null, '', u);
  $('#t-host').innerHTML = `<div class="host" id="host"><div id="hostBody"><p class="empty" style="color:#fff">Loading…</p></div></div>`;
  if(board) paint(board);
  poll();
  host.clockT = setInterval(paintClock, 250);
}
async function poll(){
  clearTimeout(host.timer);
  try{ const b = await MC.authed('mc_session_board', { p_code:host.code }); paint(b); }
  catch(e){ $('#hostBody').innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p><button class="btn" id="nw">New game</button></div>`; $('#nw').onclick = () => hostSetup(); return; }
  host.timer = setTimeout(poll, host.board && host.board.status === 'ended' ? 15000 : 2000);
}
function settingsSummary(b){
  const g = MC.gameById(b.game.id), s = b.settings || {};
  return g.settings.map(f => { const v = s[f.key]; if(v == null) return '';
    const lab = f.options ? ((f.options.find(o => String(o[0]) === String(v)) || [0, v])[1]) : v;
    return `${f.label.replace(' (minutes)', '')}: <b>${esc(lab)}${f.key === 'minutes' ? ' min' : ''}</b>`; }).filter(Boolean).join(' · ');
}
function paint(b){
  host.board = b; host.offset = Date.parse(b.server_now) - Date.now();
  const g = b.game, players = b.players, total = players.length;
  // live team games (Capture the Flag): the referee on this screen picks the teams when the game starts
  const lt = (host.live && host.live.teams) || host.liveTeams;
  if(lt && Object.keys(lt).length && !b.teams.length && b.status !== 'lobby'){
    host.liveTeams = lt; const T = {};
    players.forEach(p => { if(!p.team && lt[p.username]) p.team = lt[p.username];
      if(p.team){ const t = T[p.team] || (T[p.team] = { team:p.team, players:0, total:0, correct:0 }); t.players++; t.total += +p.score || 0; t.correct += p.correct || 0; } });
    b.teams = Object.values(T).sort((x, y) => y.total - x.total);
  }
  const top = (b.status === 'ended' ? '' : `<div class="hosttop"><div class="bigcode" aria-label="Game code ${esc(b.code)}">${esc(b.code)}</div></div>`) + `
    <div class="hostbar"><h2>${esc(g.name)}</h2>
      <span id="liveLink" class="muted" style="color:#B9D3DA;font-weight:800" hidden></span>
      <span class="clock" id="clock" ${b.status === 'live' ? '' : 'hidden'}></span>
      ${b.status === 'lobby' ? `<button class="btn" id="start" style="font-size:1.25rem;padding:14px 28px" ${total ? '' : 'disabled'}>Start game</button>` : ''}
      ${b.status === 'lobby' ? `<button class="btn alt" id="cancel">Cancel and choose another game</button>` : ''}
      ${b.status === 'live' ? `<button class="btn hot" id="end">End game</button>` : ''}
      ${b.status === 'ended' ? `<button class="btn" id="nw">Host another game</button>` : ''}
      <button class="btn alt" id="full">${document.querySelector('.host.full') ? 'Exit full screen' : 'Full screen'}</button></div>`;
  let body = '';
  if(b.status === 'lobby'){
    body = `<p style="font-weight:900;font-size:1.3rem">${total} player${total === 1 ? '' : 's'} joined${total ? '' : '. Waiting for students'}<span class="${total ? '' : 'mc-dots'}"></span></p>
      <div class="chips">${players.map(p => `<span class="chip">${p.team ? `<i class="tm" style="background:${MC.teamColour(p.team)}" title="Team ${esc(p.team)}"></i>` : ''}${MC.nameHTML(p.username, p.look)}<button class="x" data-kick="${esc(p.username)}" aria-label="Remove ${esc(p.username)}">✕</button></span>`).join('')}</div>`;
  } else {
    const ended = b.status === 'ended';
    const teams = b.teams.length ? teamBars(b) : '';
    const ranked = players.filter(p => p.score != null || p.correct);
    const podium = ended && ranked.length ? '<div id="podSlot"></div>' : '';
    body = `${ended ? '<h2 class="pod-title">Final results</h2>' : ''}${podium}${teams}
      <table class="live"><tbody>${players.map((p, i) => `<tr class="${p.active || ended || p.finished ? '' : 'idle'}"><td>${p.score != null || p.correct ? i + 1 : ''}</td>
        <td>${p.team ? `<i class="tm" style="display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;background:${MC.teamColour(p.team)}"></i>` : ''}${MC.nameHTML(p.username, p.look)}</td>
        <td class="st">${esc(p.status_text || '')}${p.finished ? ' <span class="fin">✓ finished</span>' : ''}</td>
        <td class="sc">${p.score == null ? '–' : MC.fmtScore(g, p.score)}</td></tr>`).join('')}</tbody></table>
      ${players.length ? '' : '<p class="empty" style="color:#fff">Nobody joined this game.</p>'}`;
  }
  $('#hostBody').innerHTML = top + body;
  document.body.classList.toggle('hosting', b.status !== 'ended');
  const slot = document.getElementById('podSlot');
  if(slot){ const ranked = players.filter(p => p.score != null || p.correct); slot.replaceWith(podiumEl(b, ranked.slice(0, 3))); }
  paintClock();
  if(MC.live && MC.live.supported(g.id)){
    if(b.status === 'ended'){ if(host.live && !host.endT) host.endT = setTimeout(() => { host.endT = 0; if(host.board && host.board.status === 'ended') stopLive(); }, 10000); }
    else startLive(b.code);
    if(host.liveCode) paintLive(host.live ? 'ok' : 'connecting');
  }
  const st = $('#start'); if(st) st.onclick = async () => { st.disabled = true; try{ paint(await MC.authed('mc_session_start', { p_code:b.code, p_countdown:5 })); }catch(e){ MC.ui.toast(esc(e.message)); st.disabled = false; } };
  const en = $('#end'); if(en) en.onclick = async () => { if(!confirm('End the game for everyone now?')) return; try{ paint(await MC.authed('mc_session_end', { p_code:b.code })); }catch(e){ MC.ui.toast(esc(e.message)); } };
  const cn = $('#cancel'); if(cn) cn.onclick = async () => { if(total && !confirm('Cancel this game? The students who joined will be sent back to their home page.')) return;
    try{ await MC.authed('mc_session_end', { p_code:b.code }); }catch(e){} exitFull(); hostSetup(b.game.id); };
  const nw = $('#nw'); if(nw) nw.onclick = () => { exitFull(); hostSetup(b.game.id); };
  $('#full').onclick = () => { const h = $('#host'); if(h.classList.contains('full')) exitFull(); else { h.classList.add('full'); try{ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }catch(e){} } $('#full').textContent = h.classList.contains('full') ? 'Exit full screen' : 'Full screen'; };
  $('#hostBody').querySelectorAll('[data-kick]').forEach(x => x.onclick = async () => { try{ paint(await MC.authed('mc_session_kick', { p_code:b.code, p_username:x.dataset.kick })); }catch(e){} });
}
/* the podium is built once per result (the board refreshes every few seconds; rebuilding would replay the show) */
let podCache = { key:'', el:null, mounts:[] };
function podiumEl(b, top){
  const key = b.code + '|' + top.map(p => p.username + ':' + p.score).join(',');
  if(podCache.key === key && podCache.el) return podCache.el;
  podCache.mounts.forEach(m => { try{ m.destroy(); }catch(e){} });
  const el = document.createElement('div'); el.className = 'pod'; el.setAttribute('aria-label', 'Top three');
  const CROWN = '<svg class="crown" viewBox="0 0 64 44" aria-hidden="true"><path d="M6 38 2 8l16 14L32 2l14 20L62 8l-4 30z" fill="#FFD23F" stroke="#4a2c22" stroke-width="4" stroke-linejoin="round"/><circle cx="32" cy="28" r="5" fill="#E4472D" stroke="#4a2c22" stroke-width="3"/><rect x="6" y="36" width="52" height="6" rx="3" fill="#F2B705" stroke="#4a2c22" stroke-width="3"/></svg>';
  const SUF = ['st', 'nd', 'rd'];
  el.innerHTML = '<div class="rays"></div>' + top.map((p, i) => `<div class="step p${i + 1}" data-i="${i}">
      <div class="who"></div>
      <div class="block"><div class="shine" aria-hidden="true"></div><i class="spk" style="left:12%;top:22%;animation-delay:${i * .6 + .9}s"></i><i class="spk" style="right:10%;bottom:18%;animation-delay:${i * .6 + 1.6}s"></i>${i === 0 ? CROWN : ''}<div class="place">${i + 1}<sup>${SUF[i]}</sup></div>
        <div class="foot"><div class="nm">${MC.nameHTML(p.username, p.look, { title:false, iconSize:22 })}</div>
        <div class="sc">${MC.fmtScore(b.game, p.score)}<small>${b.game && b.game.lower_is_better ? 'time' : 'points'}</small></div></div></div></div>`).join('') + '<div class="conf"></div>';
  podCache = { key, el, mounts:[] };
  setTimeout(() => { const h = el.previousElementSibling || el; if(h.scrollIntoView) h.scrollIntoView({ behavior:'smooth', block:'start' }); }, 100);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  requestAnimationFrame(() => {
    el.querySelectorAll('.step').forEach(s => {
      const p = top[+s.dataset.i];
      if(window.Brick) try{ podCache.mounts.push(Brick.mount(s.querySelector('.who'), Brick.normalize((p.look && p.look.brick) || {}), { animate:true, view:{ x0:-30, y0:-80, x1:270, y1:218 } })); }catch(e){}
    });
    // reveal 3rd, then 2nd, then 1st with confetti
    const order = [2, 1, 0], wait = reduce ? 0 : 900;
    order.forEach((i, k) => setTimeout(() => {
      const s = el.querySelector(`.step[data-i="${i}"]`); if(s) s.classList.add('in');
      if(i === 0){ el.classList.add('done'); if(!reduce) confetti(el.querySelector('.conf')); }
    }, 300 + [0, 1, 2.6][k] * wait));  // a longer drum-roll before 1st
  });
  return el;
}
function confetti(box){
  const C = ['#FFD23F', '#FF3DCB', '#2EC4B6', '#FF5A3C', '#5AAEF2', '#FFFFFF'];
  let h = '';
  for(let i = 0; i < 90; i++) h += `<i style="left:${(Math.random() * 100).toFixed(1)}%;background:${C[i % C.length]};--d:${(2.4 + Math.random() * 1.8).toFixed(2)}s;--dl:${(Math.random() * .6).toFixed(2)}s;--dx:${Math.round(Math.random() * 160 - 80)}px;--r:${Math.round(Math.random() * 900 - 450)}deg"></i>`;
  box.innerHTML = h;
}
function exitFull(){ const h = $('#host'); if(h) h.classList.remove('full'); try{ document.fullscreenElement && document.exitFullscreen(); }catch(e){} }
function teamBars(b){
  const g = b.game, max = Math.max(1, ...b.teams.map(t => Math.abs(+t.total)));
  return `<div class="teams">${b.teams.map(t => `<div class="teambar"><span style="color:${MC.teamColour(t.team)}">Team ${esc(t.team)}</span><span class="bar"><i style="width:${Math.max(3, 100 * Math.abs(+t.total) / max)}%;background:${MC.teamColour(t.team)}"></i></span><span style="text-align:right">${MC.fmtScore(g.lower_is_better ? {} : g, t.total)}</span></div>`).join('')}</div>`;
}
function paintClock(){
  const b = host.board, el = $('#clock'); if(!b || !el) return;
  if(b.status !== 'live'){ el.hidden = true; return; }
  el.hidden = false;
  const now = Date.now() + host.offset, st = Date.parse(b.starts_at);
  if(now < st){ el.textContent = 'Starting in ' + Math.ceil((st - now) / 1000); el.classList.remove('low'); return; }
  if(!b.ends_at){ const s = Math.floor((now - st) / 1000); el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); return; }
  const left = Math.max(0, Math.ceil((Date.parse(b.ends_at) - now) / 1000));
  el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  el.classList.toggle('low', left <= 30);
}

      catch(ex){ MC.ui.toast(esc(ex.message)); }
    };
    $('#allow').onchange = async e => { try{ await MC.authed('mc_admin_set_signup', { p_allow:e.target.checked }); MC.ui.toast(e.target.checked ? 'Students can make accounts.' : 'Only you can make accounts now.'); }catch(ex){ MC.ui.toast(esc(ex.message)); } };
    $('#del').onclick = async () => { try{ const r = await MC.authed('mc_admin_delete_score', { p_game:$('#dg').value, p_variant:$('#dv').value.trim(), p_username:$('#du').value.trim() });
      $('#dOut').textContent = r.deleted + ' score' + (r.deleted === 1 ? '' : 's') + ' removed.'; }catch(e){ $('#dOut').textContent = e.message; } };
    $('#list').onclick = studentAction;
  }
  try{
    const r = await MC.authed('mc_admin_students', { p_search:search || '', p_group:CLS.show || null });
    $('#allow').checked = r.allow_signup !== false;
    CLS.groups = r.groups || []; CLS.counts = r.counts || {};
    if(CLS.show && CLS.show !== '-' && !CLS.groups.includes(CLS.show)){ CLS.show = ''; return loadStudents(search); }
    drawClasses();
    const opts = cur => `<option value="">No class</option>` + CLS.groups.map(g => `<option ${g === cur ? 'selected' : ''}>${esc(g)}</option>`).join('');
    document.querySelectorAll('.grpsel').forEach(x => { const keep = x.value || (x.id === 'mkGroup' && CLS.show !== '-' ? CLS.show : ''); x.innerHTML = opts(keep); });
    $('#bulk').hidden = true;
    const empty = CLS.show === '-' ? 'Everyone is in a class.' : CLS.show ? `No students in ${esc(CLS.show)} yet. Tick students in "All students" and move them here, or make accounts straight into this class.` : 'No accounts yet.';
    $('#list').innerHTML = r.students.length ? `<table class="lb studs"><thead><tr><th class="pick"><input type="checkbox" data-pick="all" aria-label="Select everyone shown"></th><th>Username</th><th>Class</th><th class="num">Coins</th><th class="num hide-s">Scores</th><th class="hide-s">Last seen</th><th></th></tr></thead><tbody>${
      r.students.map(s => `<tr${s.banned ? ' style="opacity:.5"' : ''}><td class="pick">${s.role === 'teacher' ? '' : `<input type="checkbox" data-pick="${esc(s.username)}" aria-label="Select ${esc(s.username)}">`}</td><td><b>${esc(s.username)}</b>${s.role === 'teacher' ? ' <span class="mc-title">Teacher</span>' : ''}${s.banned ? ' <span class="err">(turned off)</span>' : ''}</td>
        <td>${s.role === 'teacher' ? '' : `<select class="rowgrp" data-g="${esc(s.username)}" aria-label="Class for ${esc(s.username)}">${opts(s.group)}</select>`}</td>
        <td class="num">${s.coins}</td><td class="num hide-s">${s.scores}</td><td class="hide-s muted">${new Date(s.last_seen).toLocaleDateString()}</td>
        <td style="text-align:right"><button class="btn sm alt" data-a="pw" data-u="${esc(s.username)}">Reset password</button><button class="btn sm alt" data-a="rn" data-u="${esc(s.username)}">Rename</button><button class="btn sm alt" data-a="coins" data-u="${esc(s.username)}">Coins</button>${
          s.role === 'teacher' ? '' : `<button class="btn sm ${s.banned ? '' : 'hot'}" data-a="ban" data-b="${s.banned ? 0 : 1}" data-u="${esc(s.username)}">${s.banned ? 'Turn on' : 'Turn off'}</button><button class="btn sm alt" data-a="del" data-u="${esc(s.username)}">Delete</button>`}</td></tr>`).join('')}</tbody></table>`
      : `<p class="empty">${empty}</p>`;
  }catch(e){ $('#list').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
/* classes (year groups): a row of class buttons to filter the list, + New class, Edit classes */
const CLS = { show:'', groups:[], counts:{}, edit:false };
function drawClasses(){
  const c = CLS.counts, all = Object.values(c).reduce((a, b) => a + b, 0);
  const chip = (val, label, n) => `<button class="cls" role="tab" data-show="${esc(val)}" aria-selected="${CLS.show === val}">${esc(label)}<span>${n || 0}</span>${
    CLS.edit && val && val !== '-' ? `<i data-ren="${esc(val)}" title="Rename" aria-label="Rename ${esc(label)}">✎</i><i data-rm="${esc(val)}" title="Remove class" aria-label="Remove ${esc(label)}">×</i>` : ''}</button>`;
  $('#classes').innerHTML = chip('', 'All students', all) + CLS.groups.map(g => chip(g, g, c[g])).join('') + (c['-'] && CLS.groups.length ? chip('-', 'Not in a class', c['-']) : '')
    + `<form class="newcls" autocomplete="off"><input name="n" maxlength="24" placeholder="New class, e.g. Year 7" aria-label="New class name"><button class="btn sm sun" type="submit">+ Add class</button></form>` + (CLS.groups.length ? `<button class="btn sm alt" data-edit="1">${CLS.edit ? 'Done' : 'Edit classes'}</button>` : '');
}
async function classAction(e){
  const t = e.target;
  try{
    if(t.closest('.newcls')) return;
    if(t.closest('[data-edit]')){ CLS.edit = !CLS.edit; drawClasses(); return; }
    const ren = t.closest('[data-ren]'), rm = t.closest('[data-rm]');
    if(ren){ const old = ren.dataset.ren, n = (prompt(`New name for ${old}:`, old) || '').trim(); if(!n || n === old) return;
      await MC.authed('mc_admin_rename_group', { p_old:old, p_new:n }); if(CLS.show === old) CLS.show = n; return loadStudents($('#q').value); }
    if(rm){ const g = rm.dataset.rm; if(!confirm(`Remove the class ${g}? Its students stay, they just won't be in a class.`)) return;
      await MC.authed('mc_admin_set_groups', { p_groups:CLS.groups.filter(x => x !== g) }); if(CLS.show === g) CLS.show = ''; return loadStudents($('#q').value); }
    const b = t.closest('[data-show]'); if(b){ CLS.show = b.dataset.show; loadStudents($('#q').value); }
  }catch(ex){ MC.ui.toast(esc(ex.message), { ms:6000 }); }
}
const picked = () => [...document.querySelectorAll('#list input[data-pick]:checked')].map(x => x.dataset.pick).filter(u => u !== 'all');
function showBulk(){ const n = picked().length; $('#bulk').hidden = !n; $('#bulkN').textContent = `${n} selected`; }
async function studentAction(e){
  const b = e.target.closest('[data-a]'); if(!b) return; const u = b.dataset.u;
  try{
    if(b.dataset.a === 'pw'){ const p = prompt(`New password for ${u} (at least 6 characters):`, rnd(WORDS) + (Math.floor(Math.random() * 90) + 10)); if(!p) return;
      await MC.authed('mc_admin_reset_password', { p_username:u, p_new:p }); MC.ui.toast(`${esc(u)}'s password is now <b>${esc(p)}</b>`, { ms:12000 }); }
    if(b.dataset.a === 'rn'){ const n = prompt(`New username for ${u}:`, u); if(!n || n === u) return; await MC.authed('mc_admin_rename', { p_username:u, p_new_username:n.trim() }); MC.ui.toast('Renamed.'); }
    if(b.dataset.a === 'coins'){ const n = prompt(`How many coins to give ${u}? (Use a minus number to take some away.)`, '20'); if(!n) return;
      await MC.authed('mc_admin_give_coins', { p_username:u, p_amount:parseInt(n, 10) }); MC.ui.toast('Coins updated.'); }
    if(b.dataset.a === 'ban'){ if(b.dataset.b === '1' && !confirm(`Turn off ${u}'s account? They won't be able to log in until you turn it back on.`)) return;
      await MC.authed('mc_admin_ban', { p_username:u, p_banned:b.dataset.b === '1' }); }
    if(b.dataset.a === 'del'){ const t = prompt(`This permanently deletes ${u}'s account, scores, coins and purchases. Type DELETE to confirm.`); if(t !== 'DELETE') return;
      await MC.authed('mc_admin_delete_account', { p_username:u }); MC.ui.toast(`${esc(u)} deleted.`); }
    loadStudents($('#q').value);
  }catch(ex){ MC.ui.toast(esc(ex.message), { ms:6000 }); }
}

/* ---------- past games ---------- */
async function loadPast(){
  const el = $('#t-past'); el.innerHTML = '<div class="card"><p class="empty">Loading…</p></div>';
  try{ const r = await MC.authed('mc_my_sessions');
    el.innerHTML = `<div class="card"><h2>Your recent class games</h2>${r.length ? `<table class="lb"><thead><tr><th>Code</th><th>Game</th><th class="num">Players</th><th>Status</th><th class="hide-s">When</th><th></th></tr></thead><tbody>${
      r.map(s => `<tr><td><b>${esc(s.code)}</b></td><td>${esc((MC.gameById(s.game) || {}).name || s.game)}</td><td class="num">${s.players}</td><td>${s.status === 'ended' ? 'Finished' : s.status === 'live' ? '<span class="ok">Playing</span>' : 'Waiting'}</td>
        <td class="hide-s muted">${new Date(s.created_at).toLocaleString()}</td><td><button class="btn sm" data-open="${esc(s.code)}">Open</button></td></tr>`).join('')}</tbody></table>` : '<p class="empty">No class games yet.</p>'}</div>`;
    el.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { showTab('host'); openHost(b.dataset.open); });
  }catch(e){ el.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}
/* ---------- who's here ---------- */
let started = false;
MC.onUser(u => {
  if(!MC.configured()){ $('#gate').innerHTML = `<div class="card"><h2>Mathcade online isn't connected yet</h2><p>Follow the setup guide, then put your Supabase details in <b>mathcade-config.js</b>. The <a href="setup-check.html">System check</a> page tells you what's missing.</p></div>`; return; }
  if(!u){ $('#app').hidden = true; $('#gate').innerHTML = `<div class="card"><h2>Log in with your teacher account</h2><button class="btn" id="li">Log in</button></div>`; $('#li').onclick = () => MC.ui.loginModal(); return; }
  if(u.role !== 'teacher'){ $('#app').hidden = true; $('#gate').innerHTML = `<div class="card"><h2>This account isn't a teacher account</h2>
    <p>To make <b>${esc(u.username)}</b> a teacher, open Supabase, go to the <b>SQL Editor</b> and run:</p>
    <pre style="background:#13233A;color:#FFE36B;padding:12px;border-radius:12px;overflow:auto;font-size:1rem">select mc_make_teacher('${esc(u.username)}');</pre><p>Then refresh this page.</p></div>`; return; }
  $('#gate').innerHTML = ''; $('#app').hidden = false;
  if(!started){ started = true; const q = new URLSearchParams(location.search); showTab('host');
    const code = q.get('code') || store.get('mc_host_code'); if(code) openHost(code); else hostSetup(q.get('game')); }
});
</script>
