<head><style id="mc-ipad">html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}*{touch-action:manipulation}input,select,textarea{font-size:max(16px,1em)!important}</style><script id="mc-ipad-js">(function(){var p=function(e){e.preventDefault();};document.addEventListener("gesturestart",p,{passive:false});document.addEventListener("gesturechange",p,{passive:false});document.addEventListener("dblclick",p,{passive:false});document.addEventListener("touchmove",function(e){if(e.scale!==undefined&&e.scale!==1)e.preventDefault();},{passive:false});var last=0;document.addEventListener("touchend",function(e){var n=Date.now(),t=e.target;if(n-last<350&&e.changedTouches.length===1&&!(t.closest&&t.closest("input,textarea,select"))){e.preventDefault();var b=t.closest&&t.closest("button,a,[role=button],label");if(b)b.click();}last=n;},{passive:false});var fix=function(){var v=window.visualViewport;if(v&&v.scale>1.01){var m=document.querySelector("meta[name=viewport]");if(m){var c=m.getAttribute("content");m.setAttribute("content",c+",width=device-width");setTimeout(function(){m.setAttribute("content",c);},60);}}};if(window.visualViewport)visualViewport.addEventListener("resize",function(){setTimeout(fix,400);});document.addEventListener("gestureend",function(){setTimeout(fix,200);});})();</script>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Baloo+2:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* Locker, "arcade" layout: tabs + L/R bar on top, item grid on the left, the student's Brick on a spotlight on the right */
.lk{margin-top:18px;border-radius:30px;padding:16px 20px 20px;background:linear-gradient(180deg,#1D3352,#152842);border:3px solid #2B4A74;box-shadow:0 10px 0 rgba(0,0,0,.3);display:grid;gap:12px}
.ltabs{display:flex;justify-content:center;gap:6px;align-items:flex-end;flex-wrap:nowrap}
.ltab{display:grid;place-items:center;gap:2px;width:78px;height:54px;border-radius:20px 20px 0 0;background:#24406A;color:#B9D3DA;border:2px solid #34588C;border-bottom:0;transition:height .15s}
.ltab svg{width:24px;height:24px}
.ltab span{font-size:.7rem;font-weight:800;line-height:1}
.ltab[aria-selected="true"]{background:var(--sun);color:#4A2606;border-color:var(--sun);height:66px}
.lbar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border-radius:999px;padding:7px 10px;background:var(--sun);margin-top:-12px;box-shadow:0 5px 0 var(--sun-edge)}
.lbar .cat{border-radius:999px;text-align:center;padding:4px 10px;font-family:var(--title);font-weight:700;font-size:1.2rem;color:#4A2606;letter-spacing:.06em;text-transform:uppercase;background:#FFF3B5}
.lbar .key{min-width:44px;height:36px;border-radius:10px;background:#1E2433;color:var(--sun);box-shadow:0 3px 0 #000;font-family:var(--title);font-weight:700;display:grid;place-items:center}
.lnote{margin:0;text-align:center;color:var(--sun);font-weight:700}
.lnote:empty{display:none}
.lmain{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;min-height:0}
.lgridb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-content:start;max-height:min(62vh,560px);overflow:auto;padding:46px 14px 16px 6px;border-right:4px solid rgba(255,227,107,.35);scrollbar-width:thin}
.it{position:relative;aspect-ratio:1/1;border-radius:18px;display:block;background:radial-gradient(circle at 50% 60%,var(--r1,#3A4F68),var(--r2,#24364C) 75%);border:3px solid var(--rc,#7E8E9F);box-shadow:0 5px 0 rgba(0,0,0,.35);color:#fff}
.it.r-Uncommon{--rc:#24965A;--r1:#1F6B48;--r2:#164A34}.it.r-Rare{--rc:#2C74D6;--r1:#2B5FA8;--r2:#1B3D73}
.it.r-Legendary{--rc:#D9750A;--r1:#9A5A14;--r2:#5E3409;box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 14px rgba(255,176,40,.55)}
.it.r-Collector{--rc:#FF3DCB;--r1:#C42A9C;--r2:#5E1250;box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 14px rgba(255,61,203,.55)}
.it.r-None{--rc:#5C6B80;--r1:#2A3A52;--r2:#1D2A3E}
.it .pv{position:absolute;inset:6%;pointer-events:none}
.it .none{position:absolute;inset:0;display:grid;place-items:center;font-size:2.2rem;font-weight:800;color:#8FA3BC;pointer-events:none}
.it .swatch{position:absolute;inset:18%;border-radius:50%;border:4px solid #22303A;pointer-events:none}
.it .txt{position:absolute;inset:8%;display:grid;place-items:center;text-align:center;font-size:.95rem;pointer-events:none}
.it .txt .mc-nm{flex-wrap:wrap;justify-content:center;max-width:100%}
.it.locked .pv{filter:grayscale(.85) brightness(.85);opacity:.5}
.it .pad{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#1E2433;color:var(--sun)}
.it[aria-pressed="true"]{outline:4px solid var(--sun);outline-offset:3px}
.it.worn::after{content:'✓';position:absolute;left:6px;top:6px;width:24px;height:24px;border-radius:50%;background:#2EC4B6;color:#0E2A33;font-weight:800;display:grid;place-items:center;font-size:.85rem}
.it.dim{opacity:.5}
.it.more{display:grid;place-items:center;align-content:center;gap:4px;text-decoration:none;--rc:var(--sun);border-style:dashed;padding:8px;text-align:center}
.it.more b{font-family:var(--title);color:var(--sun);font-size:1.2rem}
.it.more span{font-size:.8rem;font-weight:700;color:#B9D3DA;line-height:1.2}
.tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;z-index:5;pointer-events:none;font-weight:800;font-size:.95rem;border-radius:999px;padding:4px 14px;background:var(--sun);color:#4A2606;box-shadow:0 4px 0 var(--sun-edge)}
.tip::after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--sun)}
.tip small{font-weight:700;opacity:.75;margin-left:6px}
.lhero{position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:6px;min-height:360px;text-align:center}
.lhero .who{font-family:var(--title);font-weight:700;font-size:clamp(1.5rem,2.6vw,2rem);display:flex;justify-content:center;min-width:0;line-height:1.1}
.lhero .who .mc-nm{max-width:100%}
.lhero .stage{position:relative;min-height:300px;background:radial-gradient(ellipse 45% 12% at 50% 92%,rgba(255,227,107,.35),transparent 70%),radial-gradient(circle at 50% 45%,rgba(255,227,107,.12),transparent 60%)}
.lhero .wearing{font-family:var(--title);font-weight:700;color:var(--sun);letter-spacing:.02em;line-height:1.3}
.lhero .try{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.lhero .try:empty{display:none}
.toshop{position:absolute;right:-8px;top:46%;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--hot);color:#fff;box-shadow:0 4px 0 var(--hot-edge);text-decoration:none}
.toshop svg{width:26px;height:26px}
@media (max-width:860px){
  .lmain{grid-template-columns:minmax(0,1fr)}
  .lhero{order:-1;min-height:250px}.lhero .stage{min-height:200px}
  .lgridb{max-height:none;border-right:0;padding-right:6px}
  .toshop{right:4px;top:40%}
  .ltab{width:58px}.ltab span{display:none}
}
@media (max-width:520px){.lgridb{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.ltab{width:46px;height:46px}.ltab[aria-selected="true"]{height:56px}.ltab svg{width:20px;height:20px}.lk{padding:12px}}
@media (prefers-reduced-motion:reduce){.ltab{transition:none}}
</style>
</head>

<div class="bwrap">
  <header class="bbar locker">
    <a class="home" href="index.html" aria-label="Home"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12H6M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Home</span></a>
    <h1><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2.5" fill="#FFF8EE" stroke="#0E2A33" stroke-width="2"/><path d="M8.5 6h7M8.5 8.5h7M8.5 11h7" stroke="#0E2A33" stroke-width="1.6" stroke-linecap="round"/><rect x="14" y="13.5" width="2.2" height="4.5" rx="1" fill="#FFD23F" stroke="#0E2A33" stroke-width="1"/></svg>Locker</h1>
    <a class="home" href="shop.html"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 8h14l-1 13H6z" fill="#FF9F2E" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 10V6a3 3 0 0 1 6 0v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Shop</span></a>
    <div class="coins" id="coins"></div>
  </header>
  <div id="out"><p class="emptybox" style="margin-top:18px">Loading…</p></div>
</div>
<script src="mathcade-config.js"></script>
<script src="mathcade-cloud.js"></script>
<script src="brick.js"></script>
<script>
const $ = s => document.querySelector(s), esc = MC.esc, C = Brick.CATALOGUE;
const TABS = [
  { id:'base', label:'Colours', none:null, icon:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3.5 4.2 6 7.3 6 10.2A6 6 0 0 1 6 13.2C6 10.3 8.5 7.2 12 3z" fill="currentColor"/></svg>' },
  { id:'hat', label:'Hats', none:'No hat', icon:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15c0-4.4 3.6-8 8-8s8 3.6 8 8z" fill="currentColor"/><rect x="2" y="15" width="20" height="3" rx="1.5" fill="currentColor"/></svg>' },
  { id:'skin', label:'Costumes', none:'No costume', icon:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4.2" y="4" width="15.6" height="11.6" rx="5.6" fill="currentColor"/><rect x="1.6" y="8.6" width="3.6" height="5.4" rx="1.8" fill="currentColor"/><rect x="18.8" y="8.6" width="3.6" height="5.4" rx="1.8" fill="currentColor"/><rect x="7" y="14.6" width="3.6" height="4.6" rx="1" fill="currentColor"/><rect x="13.4" y="14.6" width="3.6" height="4.6" rx="1" fill="currentColor"/><rect x="6.2" y="18.6" width="5.2" height="2.2" rx="1.1" fill="currentColor"/><rect x="12.6" y="18.6" width="5.2" height="2.2" rx="1.1" fill="currentColor"/></svg>' },
  { id:'shoes', label:'Shoes', none:null, icon:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h6l2 3 6 1c2.2.4 4 1.7 4 3.5V18H3z" fill="currentColor"/><rect x="3" y="18" width="18" height="2.5" rx="1.2" fill="currentColor" opacity=".55"/></svg>' },
  { id:'fx', label:'Effects', none:'No effect', icon:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.6 2.6.9-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z" fill="currentColor"/></svg>' },
  { id:'companion', label:'Companions', none:'No companion', icon:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="8" height="15" rx="1.6" fill="currentColor"/><path d="M10 17v3M14 17v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><ellipse cx="9.5" cy="21" rx="2" ry="1.3" fill="currentColor"/><ellipse cx="14.5" cy="21" rx="2" ry="1.3" fill="currentColor"/><path d="M8 6h2M8 9h1.4M8 12h2" stroke="#0E2A33" stroke-width="1.2"/></svg>' },
  { id:'name', label:'Name', none:null, icon:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18L9 5h2l5 13h-2.4l-1.2-3.4H7.6L6.4 18zm4.3-5.4h3.4L10 7.6zM17 18v-1.6l3-3.8h-2.8V11H22v1.6l-3 3.8h3V18z" fill="currentColor"/></svg>' },
];
const NAME_KINDS = ['colour','title','icon'];
const VIEWS = { base:{ x0:-20, y0:-40, x1:260, y1:260 }, hat:{ x0:-12, y0:-44, x1:252, y1:214 }, shoes:{ x0:6, y0:74, x1:234, y1:246 }, skin:{ x0:-16, y0:-34, x1:256, y1:246 }, fx:{ x0:-6, y0:-52, x1:246, y1:200 } };
// the Collector crowns are taller than other hats (and have their own effect above them): show them with more headroom
const BIG_HATS = ['H37','H38','H39'], BIG_HAT_VIEW = { x0:-30, y0:-74, x1:270, y1:214 };
const RANK = { Free:-1, Common:0, Uncommon:1, Rare:2, Legendary:3, Collector:4 };
const LOCK = '<span class="pad"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.6"/></svg></span>';
let me = null, shopItems = [], eq = {}, big = null, tiles = [], busy = false, tab = 'skin', sel = null;
const fromHash = () => { const h = location.hash.slice(1); return TABS.some(t => t.id === h) ? h : null; };
tab = fromHash() || 'skin';
const name = id => (C.item(id) || {}).name || id;
const lookNow = () => Brick.normalize(Object.assign({}, eq));
const owns = id => !!me && (me.owned.includes(id) || (C.item(id) && C.item(id).rarity === 'Free'));
const current = slot => slot === 'shoes' ? (eq.shoes || 'S00') : slot === 'base' ? lookNow().base : (eq[slot] || null);
function tileLook(slot, id){
  const L = lookNow();
  if(slot === 'base'){ L.base = id; return L; }
  if(slot === 'hat' || slot === 'shoes') L.skin = null;
  L[slot] = id; return L;
}
const thumbLook = (slot, id) => { const L = tileLook(slot, id); if(slot !== 'fx') L.fx = null; return L; };   // tiles show just the item
function wearing(){
  const L = Brick.visible(lookNow()), bits = [name(L.base)];
  if(L.skin) bits.push(name(L.skin)); else { if(L.hat) bits.push(name(L.hat)); if(L.shoes !== 'S00') bits.push(name(L.shoes)); }
  if(L.fx) bits.push(name(L.fx));
  if(L.companion) bits.push('with ' + name(L.companion));
  return 'Wearing: ' + bits.join(', ');
}
/* everything for one tab: what you own first, then what's still in the shop, cheapest rarity first */
function list(slot){
  if(slot === 'base') return C.bases.map(b => ({ id:b.id, name:b.name, rarity:'Free', slot:'base', main:b.main, shadow:b.shadow }));
  if(slot === 'name'){
    const own = shopItems.filter(i => NAME_KINDS.includes(i.kind) && me.owned.includes(i.id)).map(i => ({ id:i.id, name:i.name, rarity:(i.data && i.data.rarity) || 'Common', slot:i.kind, item:i }));
    return own;
  }
  const all = C.bySlot(slot).map(it => Object.assign({}, it, { slot }));
  const sort = (a, b) => (RANK[a.rarity] - RANK[b.rarity]) || a.name.localeCompare(b.name);
  const mine = all.filter(it => owns(it.id)).sort(sort), rest = all.filter(it => !owns(it.id)).sort(sort);
  const t = TABS.find(x => x.id === slot);
  return (t.none ? [{ id:'', name:t.none, rarity:'None', slot }] : []).concat(mine, rest);
}
function namePreview(it){
  const look = { colour:null, title:null, icon:null };
  if(it.slot === 'colour') look.colour = it.item.data; if(it.slot === 'title') look.title = it.item.name; if(it.slot === 'icon') look.icon = it.item.data.shape;
  return MC.nameHTML(me.username, look, { iconSize:20, title:false });
}
function tileHTML(it){
  const isNone = it.id === '', own = isNone || it.slot === 'base' || NAME_KINDS.includes(it.slot) || owns(it.id);
  const worn = (current(it.slot) || '') === it.id && !(eq.skin && (it.slot === 'hat' || it.slot === 'shoes') && !isNone);
  const dim = eq.skin && (it.slot === 'hat' || it.slot === 'shoes');
  const tip = it.id === sel && !isNone ? `<span class="tip">${esc(it.name)}${own ? '' : `<small>${it.buy === false ? 'Events only' : 'Shop · ' + it.price}</small>`}</span>` : '';
  const inner = isNone ? '<span class="none" aria-hidden="true">∅</span>'
    : it.slot === 'base' ? `<span class="swatch" style="background:linear-gradient(${it.main} 62%,${it.shadow} 62%)"></span>`
    : NAME_KINDS.includes(it.slot) ? `<span class="txt">${namePreview(it)}</span>` : '<span class="pv"></span>';
  return `<button class="it r-${it.rarity} ${own ? '' : 'locked'} ${worn ? 'worn' : ''} ${dim ? 'dim' : ''}" type="button" data-slot="${it.slot}" data-id="${it.id}" aria-pressed="${worn}"
    aria-label="${esc(it.name)}${own ? (worn ? ', wearing' : '') : ', in the shop'}">${inner}${own ? '' : LOCK}${tip}</button>`;
}
function render(){
  tiles.forEach(m => m.destroy()); tiles = [];
  if(big){ big.destroy(); big = null; }
  $('#coins').innerHTML = `${MC.coinSVG(26)} ${me.coins.toLocaleString()}`;
  const t = TABS.find(x => x.id === tab), items = list(tab), s = items.find(i => i.id === sel && i.id);
  const hidden = eq.skin && (tab === 'hat' || tab === 'shoes');
  const more = tab === 'base' ? '' : `<a class="it more" href="shop.html#${tab}"><b>+ Shop</b><span>${tab === 'name' ? (items.length ? 'More name styles' : 'No name styles yet') : 'Find more ' + t.label.toLowerCase()}</span></a>`;
  const trying = s && !owns(s.id) && s.slot !== 'base' && !NAME_KINDS.includes(s.slot);
  $('#out').innerHTML = `<section class="lk" aria-label="Locker">
    <div class="ltabs" role="tablist" aria-label="Item types">${TABS.map(x => `<button class="ltab" role="tab" type="button" data-tab="${x.id}" aria-selected="${x.id === tab}" aria-label="${x.label}">${x.icon}<span>${x.label}</span></button>`).join('')}</div>
    <div class="lbar"><button class="key" type="button" data-step="-1" aria-label="Previous">L</button><div class="cat" id="h-${tab}">${t.label === 'Effects' ? 'Hat effects' : t.label === 'Name' ? 'Name style' : t.label}</div><button class="key" type="button" data-step="1" aria-label="Next">R</button></div>
    <p class="lnote" id="note">${hidden ? 'Hidden under your costume. Tap one to take the costume off.' : ''}</p>
    <div class="lmain">
      <div class="lgridb" id="grid">${items.map(tileHTML).join('')}${more}</div>
      <aside class="lhero" aria-label="Your character"><div class="who" id="who">${MC.nameHTML(me.username, me.look, { iconSize:28 })}</div>
        <div class="stage" id="stage"></div>
        <div>${trying ? `<div class="wearing" id="wearing" aria-live="polite">Trying on ${esc(s.name)}</div>` : ''}
        ${trying ? `<p class="try"><a class="btn sun" href="shop.html#${s.slot}">${s.buy === false ? 'Collector: earned in events' : `Get it in the Shop · ${s.price}`}</a></p>` : ''}</div>
        <a class="toshop" href="shop.html#${tab === 'base' ? 'hat' : tab}" aria-label="Go to the Shop"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </aside></div></section>`;
  big = Brick.mount($('#stage'), trying ? tileLook(s.slot, s.id) : lookNow(), { animate:true, companion:true });   // your companion stands beside you
  document.querySelectorAll('.it .pv').forEach(pv => { const b = pv.closest('.it');
    if(b.dataset.slot === 'companion'){ tiles.push(Brick.mount(pv, thumbLook('companion', b.dataset.id), { only:'companion', animate:false })); return; }
    tiles.push(Brick.mount(pv, thumbLook(b.dataset.slot, b.dataset.id), { view:(b.dataset.slot === 'hat' && BIG_HATS.includes(b.dataset.id)) ? BIG_HAT_VIEW : VIEWS[b.dataset.slot], animate:false, maxParticles:8 })); });
  const se = $('.it[data-id="' + (sel || '') + '"]'), g = $('#grid'); if(se && sel) g.scrollTop = Math.max(0, se.offsetTop - g.offsetTop - 46);
}
function setTab(id){ tab = id; sel = null; try{ history.replaceState(null, '', '#' + id); }catch(e){} render(); }
async function load(){
  if(!MC.configured()){ $('#out').innerHTML = '<p class="notice" style="margin-top:18px">The locker opens once your teacher has finished setting up Mathcade online.</p>'; return; }
  if(!MC.token()){ me = null; $('#coins').innerHTML = '';
    $('#out').innerHTML = `<div class="card" style="margin-top:18px"><p><b>Log in to open your locker.</b></p><button class="btn" id="li">Log in</button></div>`;
    $('#li').onclick = () => MC.ui.loginModal(); return; }
  try{
    const r = await MC.rpc('mc_shop', { p_token:MC.token() });
    me = r.me; shopItems = r.items; eq = Object.assign({}, me.equipped);
    render();
  }catch(e){ $('#out').innerHTML = `<p class="notice" style="margin-top:18px">${esc(e.message)}</p>`; }
}
$('#out').addEventListener('click', async e => {
  const tb = e.target.closest('[data-tab]'), k = e.target.closest('[data-step]');
  if(tb){ setTab(tb.dataset.tab); return; }
  if(k){ const i = TABS.findIndex(x => x.id === tab); setTab(TABS[(i + +k.dataset.step + TABS.length) % TABS.length].id); return; }
  const b = e.target.closest('button[data-slot]'); if(!b || busy || !me) return;
  const slot = b.dataset.slot, id = b.dataset.id || null;
  if(id && slot !== 'base' && !NAME_KINDS.includes(slot) && !owns(id)){ sel = id; render(); return; }   // still in the shop: try it on
  sel = id;
  const cur = current(slot);
  let next = id === cur && !(eq.skin && (slot === 'hat' || slot === 'shoes')) ? null : id;   // tap the worn one to take it off
  if(slot === 'base' && !next){ render(); return; }
  if(slot === 'shoes' && next === null && cur === 'S00'){ render(); return; }
  const before = Object.assign({}, eq);
  if(next == null) delete eq[slot]; else { eq[slot] = next; if(slot === 'hat' || slot === 'shoes') delete eq.skin; }
  render(); busy = true;
  try{ me = await MC.authed('mc_equip', { p_kind:slot, p_item:next }); eq = Object.assign({}, me.equipped); render(); MC.refreshMe(); }
  catch(ex){ eq = before; render(); MC.ui.toast(esc(ex.message)); }
  busy = false;
});
document.addEventListener('keydown', e => { if(!me || e.target.closest('input,textarea')) return;
  if(e.key === 'q' || e.key === 'e'){ const i = TABS.findIndex(x => x.id === tab); setTab(TABS[(i + (e.key === 'e' ? 1 : -1) + TABS.length) % TABS.length].id); } });
window.addEventListener('hashchange', () => { const h = fromHash(); if(h && h !== tab && me) setTab(h); });
MC.onUser(u => { if(!!u !== !!me || (u && me && u.username !== me.username)) load(); });
load();
</script>
