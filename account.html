<!DOCTYPE html>
<html lang="en">
<head><style id="mc-ipad">html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}*{touch-action:manipulation}input,select,textarea{font-size:max(16px,1em)!important}</style><script id="mc-ipad-js">(function(){var p=function(e){e.preventDefault();};document.addEventListener("gesturestart",p,{passive:false});document.addEventListener("gesturechange",p,{passive:false});document.addEventListener("dblclick",p,{passive:false});document.addEventListener("touchmove",function(e){if(e.scale!==undefined&&e.scale!==1)e.preventDefault();},{passive:false});var last=0;document.addEventListener("touchend",function(e){var n=Date.now(),t=e.target;if(n-last<350&&e.changedTouches.length===1&&!(t.closest&&t.closest("input,textarea,select"))){e.preventDefault();var b=t.closest&&t.closest("button,a,[role=button],label");if(b)b.click();}last=n;},{passive:false});var fix=function(){var v=window.visualViewport;if(v&&v.scale>1.01){var m=document.querySelector("meta[name=viewport]");if(m){var c=m.getAttribute("content");m.setAttribute("content",c+",width=device-width");setTimeout(function(){m.setAttribute("content",c);},60);}}};if(window.visualViewport)visualViewport.addEventListener("resize",function(){setTimeout(fix,400);});document.addEventListener("gestureend",function(){setTimeout(fix,200);});})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>My Mathcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Baloo+2:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mathcade-pages.css">
<style>.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:760px){.grid2{grid-template-columns:1fr}}</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>
  <h1 class="pg">My scores</h1>
  <p class="lead">Your best result in every game you've played while logged in.</p>
  <div id="out"></div>
</div>
<script src="mathcade-config.js"></script>
<script src="mathcade-cloud.js"></script>
<script src="mathcade-nav.js"></script>
<script>
const $ = s => document.querySelector(s), esc = MC.esc;
MCNav.mount($('#nav'), { home:true });
let gamesMeta = {};
async function load(){
  if(!MC.token()){ $('#out').innerHTML = `<div class="card"><p><b>You're not logged in.</b></p><button class="btn" id="li">Log in</button></div>`; $('#li').onclick = () => MC.ui.loginModal(); return; }
  try{
    const [bests, games] = await Promise.all([MC.authed('mc_my_bests'), MC.rpc('mc_games_list')]);
    games.forEach(g => gamesMeta[g.id] = g);
    const u = MC.user || await MC.refreshMe();
    $('#out').innerHTML = `<div class="grid2">
      <section class="card"><h2>${MC.nameHTML(u.username, u.look)}</h2>
        <p class="row">${MC.coinSVG(22)} <b style="font-size:1.3rem">${u.coins.toLocaleString()}</b> coins to spend <span class="muted">(${u.coins_earned.toLocaleString()} earned in total)</span></p>
        <div class="row"><a class="btn sun" href="shop.html">Go to the shop</a><a class="btn" href="locker.html">Open my locker</a><button class="btn alt" id="pw">Change password</button><button class="btn alt" id="lo">Log out</button></div></section>
      <section class="card"><h2>Personal bests</h2>${bests.length ? `<table class="lb"><thead><tr><th>Game</th><th>Mode</th><th class="num">Best</th><th class="num">Played</th></tr></thead><tbody>${
        bests.map(b => { const g = gamesMeta[b.game] || { name:b.game };
          return `<tr><td><a href="leaderboards.html?game=${encodeURIComponent(b.game)}&variant=${encodeURIComponent(b.variant)}">${esc(g.name)}</a></td><td class="muted">${esc(b.variant || '')}</td>
            <td class="num big">${b.best == null ? '–' : MC.fmtScore(g, b.best)}</td><td class="num">${b.plays}</td></tr>`; }).join('')}</tbody></table>`
        : '<p class="empty">No scores yet. Go and play a game!</p>'}</section></div>`;
    $('#pw').onclick = () => MC.ui.passwordModal();
    $('#lo').onclick = async () => { await MC.logout(); load(); };
  }catch(e){ $('#out').innerHTML = `<p class="notice">${esc(e.message)}</p>`; }
}
MC.onUser(() => load());
</script>
</body>
</html>
