<!DOCTYPE html>
<html lang="en">
<head><style id="mc-ipad">html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}*{touch-action:manipulation}input,select,textarea{font-size:max(16px,1em)!important}</style><script id="mc-ipad-js">(function(){var p=function(e){e.preventDefault();};document.addEventListener("gesturestart",p,{passive:false});document.addEventListener("gesturechange",p,{passive:false});document.addEventListener("dblclick",p,{passive:false});document.addEventListener("touchmove",function(e){if(e.scale!==undefined&&e.scale!==1)e.preventDefault();},{passive:false});var last=0;document.addEventListener("touchend",function(e){var n=Date.now(),t=e.target;if(n-last<350&&e.changedTouches.length===1&&!(t.closest&&t.closest("input,textarea,select"))){e.preventDefault();var b=t.closest&&t.closest("button,a,[role=button],label");if(b)b.click();}last=n;},{passive:false});var fix=function(){var v=window.visualViewport;if(v&&v.scale>1.01){var m=document.querySelector("meta[name=viewport]");if(m){var c=m.getAttribute("content");m.setAttribute("content",c+",width=device-width");setTimeout(function(){m.setAttribute("content",c);},60);}}};if(window.visualViewport)visualViewport.addEventListener("resize",function(){setTimeout(fix,400);});document.addEventListener("gestureend",function(){setTimeout(fix,200);});})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mathcade Leaderboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Baloo+2:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mathcade-pages.css">
<link rel="stylesheet" href="game-tiles.css">
<style>
/* the games are folder tabs along the top of one card; the controls sit in a toolbar inside it */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 4px;margin-top:14px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:grid;justify-items:center;gap:4px;padding:8px 10px 10px;border-radius:16px 16px 0 0;min-width:112px;color:#B9D3DA;font-weight:800;font-size:.82rem;text-align:center;line-height:1.15;flex:none}
.tab:hover{color:var(--cream)}
.tab[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.mini{display:inline-grid;place-items:center;width:72px;height:52px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.06)}
.tab[aria-pressed="true"] .mini{background:#1D3352}
.mini .in{width:215px;height:168px;zoom:.32;display:grid;place-items:center;padding:4px 10px 30px;pointer-events:none}
.cardc{background:var(--card);color:var(--ink);border-radius:0 20px 20px 20px;padding:16px 18px 18px;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.tool{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--chip-edge);margin-bottom:6px}
.tool h2{margin:0;font-family:var(--title);font-size:1.6rem}
.tool .rule{flex:1 1 0;min-width:0}
.tool .top10{font-family:var(--title);font-weight:700;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;color:#3B2300;background:#FFD23F;border-radius:999px;padding:4px 12px;box-shadow:inset 0 -3px 0 #D9A21F;white-space:nowrap}
.tool .right{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tool label{font-weight:800;font-size:.9rem}
.tool select{padding:7px 10px;border-radius:12px;border:2px solid var(--chip-edge);background:#fff;font:inherit;font-weight:800}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:4px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:900;font-size:.9rem;color:var(--ink);opacity:.8}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--hint);opacity:1;box-shadow:inset 0 -3px 0 var(--sun-edge)}
td.player .mc-nm{max-width:100%}
table.lb .r{width:44px;font-weight:900}
.seeall{display:flex;justify-content:center;padding:12px 0 2px}
.notice{margin-bottom:14px}
@media (max-width:640px){.tool .right{margin-left:0}.tab{min-width:92px;font-size:.74rem}.mini{width:60px;height:44px}.mini .in{zoom:.27}}
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>
  <h1 class="pg">Leaderboards</h1>
  <div id="setupNote"></div>
  <div class="tabs" id="games" role="tablist" aria-label="Game"></div>
  <div class="cardc">
    <div class="tool"><h2 id="title">Leaderboard</h2><span class="top10">Top 10</span><span class="rule"></span>
      <div class="right">
        <label id="varWrap" hidden><span id="varLabel">Mode</span> <select id="variant"></select></label>
        <div class="seg" id="period" role="group" aria-label="Time period">
          <button type="button" data-p="all">All time</button><button type="button" data-p="year">This year</button>
          <button type="button" data-p="month">30 days</button><button type="button" data-p="week">7 days</button>
        </div>
      </div>
    </div>
    <div id="podium"></div>
    <div id="board"><div class="empty">Loading…</div></div>
  </div>
</div>
<script src="mathcade-config.js"></script>
<script src="mathcade-cloud.js"></script>
<script src="mathcade-nav.js"></script>
<script src="game-tiles.js"></script>
<script src="brick.js"></script>
<script>
const $ = s => document.querySelector(s), esc = MC.esc;
MCNav.mount($('#nav'), { current:'leaderboards', home:true, homeOnly:true });
const RULES = {
  'speed-golf':'Lowest time wins. Rounds count when at least 70% of answers are right.',
  'speed-run':'Fastest finish time.', 'lava':'Fastest climb to the top.', 'grand-prix':'Fastest finished race.',
  'ctf':'100 points per flag captured and 25 per tank destroyed.', 'royale':'Points for knockouts and for how long you survive.',
  'slice-rush':'Highest profit wins.', 'treasure':'Most treasure wins.', 'zombie':'Most points wins (races won, plus a bonus for being on the winning side).', 'hideseek':'Most points wins (catches, plus a bonus for being on the winning team).', 'farm':'Most money from fruit sold wins.', 'outbreak':'Survive the night: every game you survive counts 1. Most survivals wins.',
};
const VARIANT_LABEL = { 'slice-rush':'Round length', fishing:'Round length', ctf:'Round length', treasure:'Round length', zombie:'Round length', hideseek:'Round length', farm:'Round length', sharpshooter:'Round length',
  'speed-golf':'Course', 'speed-run':'Maths difficulty', lava:'Lava speed', 'grand-prix':'Race', royale:'Battle size' };
const TOP = 10;                               // every leaderboard shows the top 10 only (podium + places 4 to 10)
const TILES = window.MC_TILES || [];
const tile = id => TILES.find(t => t.game === id) || {};
const q = new URLSearchParams(location.search);
let state = { game:q.get('game') || 'fishing', variant:q.get('variant'), period:q.get('period') || 'all' }, showAll = false;
if(!MC.gameById(state.game)) state.game = 'fishing';

$('#games').innerHTML = MC.GAMES.map(g => `<button class="tab" type="button" role="tab" data-g="${g.id}"><span class="mini" style="background:${esc(tile(g.id).bg || '#1D3352')}"><span class="in">${tile(g.id).html || ''}</span></span><span>${esc(g.name.replace('Battle Tank ','').replace('Mathcade ',''))}</span></button>`).join('');
$('#games').onclick = e => { const b = e.target.closest('[data-g]'); if(b){ state.game = b.dataset.g; state.variant = null; showAll = false; load(); } };
$('#period').onclick = e => { const b = e.target.closest('[data-p]'); if(b){ state.period = b.dataset.p; showAll = false; load(); } };
$('#variant').onchange = () => { state.variant = $('#variant').value; showAll = false; load(); };


/* the podium is only rebuilt when the top three change (the board refreshes every 30 s) */
let podKey = '', podMounts = [];
const CROWN = '<svg class="crown" viewBox="0 0 64 44" aria-hidden="true"><path d="M6 38 2 8l16 14L32 2l14 20L62 8l-4 30z" fill="#FFD23F" stroke="#4a2c22" stroke-width="4" stroke-linejoin="round"/><circle cx="32" cy="28" r="5" fill="#E4472D" stroke="#4a2c22" stroke-width="3"/><rect x="6" y="36" width="52" height="6" rx="3" fill="#F2B705" stroke="#4a2c22" stroke-width="3"/></svg>';
function podium(g, top){
  const key = g.id + '|' + state.variant + '|' + state.period + '|' + top.map(p => p.username + ':' + p.score).join(',');
  if(key === podKey) return;
  podKey = key; podMounts.forEach(m => { try{ m.destroy(); }catch(e){} }); podMounts = [];
  const box = $('#podium');
  if(!top.length){ box.innerHTML = ''; return; }
  const SUF = ['st','nd','rd'], unit = g.unit === 's' ? 'time' : (g.score_label || 'points').toLowerCase();
  box.innerHTML = `<div class="pod n${top.length}" aria-label="Top three"><div class="rays"></div>${top.map((p, i) => `<div class="step p${i + 1}">
      <div class="who" data-i="${i}"></div>
      <div class="block"><div class="shine" aria-hidden="true"></div>${i === 0 ? CROWN : ''}<div class="place">${i + 1}<sup>${SUF[i]}</sup></div>
        <div class="foot"><div class="nm">${MC.nameHTML(p.username, p.look, { title:false, iconSize:18 })}</div><div class="sc">${MC.fmtScore(g, p.score)}<small>${esc(unit)}</small></div></div></div></div>`).join('')}</div>`;
  box.querySelectorAll('.who').forEach(el => { const p = top[+el.dataset.i];
    try{ podMounts.push(Brick.mount(el, Brick.normalize((p.look && p.look.brick) || {}), { animate:true, view:{ x0:-30, y0:-80, x1:270, y1:218 } })); }catch(e){} });
}

let seq = 0, timer = 0;
async function load(){
  const n = ++seq;
  document.querySelectorAll('#games .tab').forEach(b => { const on = b.dataset.g === state.game; b.setAttribute('aria-pressed', on); if(on && b.scrollIntoView) b.scrollIntoView({ block:'nearest', inline:'nearest' }); });
  document.querySelectorAll('#period button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === state.period));
  const u = new URL(location.href); u.search = new URLSearchParams(Object.fromEntries(Object.entries(state).filter(([k,v]) => v))).toString(); history.replaceState(null, '', u);
  $('#title').textContent = MC.gameById(state.game).name;
  if(!MC.configured()){ $('#setupNote').innerHTML = '<p class="notice">Leaderboards appear once your teacher has finished setting up Mathcade online.</p>'; $('#board').innerHTML = '<div class="empty">No scores yet.</div>'; return; }
  try{
    const r = await MC.rpc('mc_leaderboard', { p_game:state.game, p_variant:state.variant, p_period:state.period, p_limit:TOP });
    if(n !== seq) return;
    state.variant = r.variant;
    const vs = r.variants || [], players = (vs.find(v => v.variant === r.variant) || {}).players;
    $('#varWrap').hidden = r.game.id === 'outbreak' || !(vs.length > 1 || (vs.length === 1 && vs[0].variant));   // a tally game (Total Outbreak) has one board
    $('#varLabel').textContent = VARIANT_LABEL[r.game.id] || 'Mode';
    $('#variant').innerHTML = vs.map(v => `<option value="${esc(v.variant)}" ${v.variant === r.variant ? 'selected' : ''}>${esc(v.variant || 'Standard')} (${v.players} player${v.players===1?'':'s'})</option>`).join('');
    const me = MC.user && MC.user.username, rows = r.rows.slice(0, TOP);
    podium(r.game, rows.slice(0, 3));
    if(!rows.length){ $('#board').innerHTML = `<div class="empty">No scores here yet. Play ${esc(r.game.name)} while logged in to get on the board!</div>`; return; }
    const rest = rows.slice(3), shown = rest;
    if(!rest.length){ $('#board').innerHTML = `<div class="empty">${rows.length === 1 ? 'One player so far.' : 'Just the podium so far.'} Play ${esc(r.game.name)} while logged in to join them!</div>`; return; }
    $('#board').innerHTML = `
      <table class="lb"><thead><tr><th>#</th><th>Player</th><th class="num">${esc(r.game.score_label)}</th><th class="num hide-s">When</th></tr></thead><tbody>${
      shown.map(x => `<tr class="${x.username === me ? 'me' : ''}"><td class="r">${x.rank}</td>
        <td class="player">${MC.nameHTML(x.username, x.look)}</td><td class="num big">${MC.fmtScore(r.game, x.score)}</td>
        <td class="num hide-s muted">${new Date(x.at).toLocaleDateString()}</td></tr>`).join('')}</tbody></table>
`;
  }catch(e){ if(n === seq) $('#board').innerHTML = `<div class="empty err">${esc(e.message)}</div>`; }
  clearTimeout(timer); timer = setTimeout(load, 30000);
}
load();
</script>
</body>
</html>
