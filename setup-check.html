<!DOCTYPE html>
<html lang="en">
<head><style id="mc-ipad">html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}*{touch-action:manipulation}input,select,textarea{font-size:max(16px,1em)!important}</style><script id="mc-ipad-js">(function(){var p=function(e){e.preventDefault();};document.addEventListener("gesturestart",p,{passive:false});document.addEventListener("gesturechange",p,{passive:false});document.addEventListener("dblclick",p,{passive:false});document.addEventListener("touchmove",function(e){if(e.scale!==undefined&&e.scale!==1)e.preventDefault();},{passive:false});var last=0;document.addEventListener("touchend",function(e){var n=Date.now(),t=e.target;if(n-last<350&&e.changedTouches.length===1&&!(t.closest&&t.closest("input,textarea,select"))){e.preventDefault();var b=t.closest&&t.closest("button,a,[role=button],label");if(b)b.click();}last=n;},{passive:false});var fix=function(){var v=window.visualViewport;if(v&&v.scale>1.01){var m=document.querySelector("meta[name=viewport]");if(m){var c=m.getAttribute("content");m.setAttribute("content",c+",width=device-width");setTimeout(function(){m.setAttribute("content",c);},60);}}};if(window.visualViewport)visualViewport.addEventListener("resize",function(){setTimeout(fix,400);});document.addEventListener("gestureend",function(){setTimeout(fix,200);});})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mathcade System Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Lilita+One&family=Baloo+2:wght@400;500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mathcade-pages.css">
<style>
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #EFE2CD}
.checks .ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:#9AA8B6}
.checks .pass .ic{background:var(--good)} .checks .fail .ic{background:var(--bad)} .checks .warn .ic{background:#D9A21F}
.checks b{display:block}
code{background:#13233A;color:#FFE36B;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>
  <h1 class="pg">System check</h1>
  <p class="lead">Open this page after each setup step. Everything should end up green.</p>
  <section class="card"><ul class="checks" id="list"></ul><p style="margin-top:14px"><button class="btn" id="again">Check again</button></p></section>
</div>
<script src="mathcade-config.js"></script>
<script src="mathcade-cloud.js"></script>
<script src="mathcade-nav.js"></script>
<script>
const $ = s => document.querySelector(s), esc = MC.esc;
MCNav.mount($('#nav'), {});
function item(state, title, text){ return `<li class="${state}"><span class="ic">${state === 'pass' ? '✓' : state === 'fail' ? '!' : state === 'warn' ? '?' : '…'}</span><span><b>${title}</b>${text || ''}</span></li>`; }
async function run(){
  const out = [], show = () => $('#list').innerHTML = out.join('');
  const c = MC.config;
  // 1. config file
  if(!c.supabaseUrl || /PASTE/.test(c.supabaseUrl)) { out.push(item('fail', 'Project URL missing', 'Open <code>mathcade-config.js</code> and paste your Supabase Project URL (step 4 of the guide).')); show(); return; }
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(c.supabaseUrl)) out.push(item('warn', 'Project URL looks unusual', `It's <code>${esc(c.supabaseUrl)}</code>. It normally looks like https://abcdefgh.supabase.co with nothing after .co (delete anything after .co in <code>mathcade-config.js</code>).`));
  else out.push(item('pass', 'Project URL is filled in', ''));
  if(!c.supabaseKey || /PASTE/.test(c.supabaseKey)) { out.push(item('fail', 'Key missing', 'Paste the publishable (or anon public) key into <code>mathcade-config.js</code>.')); show(); return; }
  if(/^sb_secret_/.test(c.supabaseKey) || /service_role/.test(atobSafe(c.supabaseKey))) { out.push(item('fail', 'That is the SECRET key', 'Remove it now and use the <b>publishable</b> key instead. The secret key must never go on a website.')); show(); return; }
  out.push(item('pass', 'Key is filled in', '')); show();
  // 2. database
  let ping;
  try{ ping = await MC.rpc('mc_ping'); out.push(item('pass', 'Database is set up', ` <span class="muted">${ping.accounts} account${ping.accounts === 1 ? '' : 's'} so far.</span>`)); }
  catch(e){ out.push(item('fail', 'Can’t use the database yet', `<span class="muted">${esc(e.message)}</span><br>Check the URL and key, and that you ran <code>mathcade-setup.sql</code> in the SQL Editor (step 3).`)); show(); return; }
  show();
  // 3. teacher
  if(ping.teachers > 0) out.push(item('pass', 'A teacher account exists', ''));
  else out.push(item('warn', 'No teacher account yet', 'Log in (top right) to make your account, then in Supabase SQL Editor run <code>select mc_make_teacher(\'your_username\');</code> (step 6).'));
  out.push(item(ping.allow_signup === false ? 'warn' : 'pass', ping.allow_signup === false ? 'Students can’t make their own accounts' : 'Students can make their own accounts', ping.allow_signup === false ? ' <span class="muted">You turned this off. Make accounts for them in the Teacher dashboard.</span>' : ''));
  // 4. clock
  const skew = Math.abs(Date.parse(ping.server_now) - Date.now()) / 1000;
  out.push(item(skew < 30 ? 'pass' : 'warn', skew < 30 ? 'This device’s clock matches the server' : 'This device’s clock is ' + Math.round(skew) + ' s out', skew < 30 ? '' : ' <span class="muted">Class games still start together, but check the computer’s time settings.</span>'));
  show();
  // 5. live multiplayer (used by Speed Run class games)
  const idx = out.push(item('', 'Checking live multiplayer\u2026', '')) - 1; show();
  try{
    const c = await Promise.race([MC.live.player('CHECK' + Math.floor(Math.random() * 1e6), () => {}), new Promise((_, r) => setTimeout(() => r(new Error('No answer after 10 seconds')), 10000))]);
    c.close(); out[idx] = item('pass', 'Live multiplayer connection works', ' <span class="muted">Classmates can see each other in Speed Run class games.</span>');
  }catch(e){ out[idx] = item('warn', 'Live multiplayer can\u2019t connect', ` <span class="muted">${esc(e.message)}. Games still work, just without seeing classmates. In Supabase check Realtime \u2192 Settings allows public access, and that your school network allows WebSockets.</span>`); }
  show();
}
function atobSafe(k){ try{ return atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')); }catch(e){ return ''; } }
$('#again').onclick = run; run();
</script>
</body>
</html>
